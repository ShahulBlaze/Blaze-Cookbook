<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blaze's Cook Book</title>
<meta name="description" content="Blaze's batch-cooking recipe book with live nutrition tracking.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#211c14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cook Book">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
  html, body {
    margin: 0; padding: 0;
    background: #211c14;
    min-height: 100vh;
  }

  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');

  #rb-root {
    --bg: #211c14;
    --surface: #2a2319;
    --surface-2: #332b1e;
    --line: rgba(241,233,216,0.14);
    --text: #f1e9d8;
    --muted: #a89a82;
    --mustard: #e3a008;
    --paprika: #d1531c;
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    border-radius: 14px;
    overflow: hidden;
    max-width: 460px;
    margin: 0 auto;
    min-height: 480px;
  }
  #rb-root * { box-sizing: border-box; }
  #rb-root button { font-family: inherit; cursor: pointer; }

  .rb-header { padding: 22px 20px 16px; border-bottom: 1px solid var(--line); }
  .rb-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 26px; letter-spacing: -0.01em; margin: 0; }
  .rb-subtitle { color: var(--muted); font-size: 13.5px; margin: 4px 0 0; }

  .rb-body { padding: 4px 20px 24px; }

  .rb-toggle-panel {
    background: var(--surface); border-radius: 12px; padding: 12px 14px;
    margin: 16px 0 6px; display: flex; flex-direction: column; gap: 12px;
  }
  .rb-toggle-panel.rb-toggle-panel-inline { margin: 6px 0 18px; }
  .rb-toggle-heading { font-size: 11.5px; color: var(--muted); margin: 0 0 -2px; }
  .rb-toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .rb-toggle-label { font-size: 13.5px; line-height: 1.3; }
  .rb-toggle-sub { display: block; font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .rb-switch-wrap { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
  .rb-switch-input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .rb-switch { position: absolute; inset: 0; border-radius: 12px; background: var(--line); pointer-events: none; transition: background .15s; }
  .rb-switch::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px;
    border-radius: 50%; background: var(--text); transition: transform .15s;
  }
  .rb-switch-input:checked + .rb-switch { background: var(--mustard); }
  .rb-switch-input:checked + .rb-switch::after { transform: translateX(18px); background: var(--bg); }

  .rb-cat-heading { font-family: 'Fraunces', serif; font-weight: 500; font-size: 16px; color: var(--mustard); margin: 22px 0 6px; }

  .rb-row {
    width: 100%; background: none; border: none; border-bottom: 1px solid var(--line);
    padding: 13px 2px; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; text-align: left; color: inherit;
  }
  .rb-row-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .rb-row-title { font-size: 15px; font-weight: 500; line-height: 1.3; }
  .rb-row-meta { font-size: 12.5px; color: var(--muted); }
  .rb-chevron { color: var(--muted); font-size: 18px; flex-shrink: 0; }
  .rb-row-check { font-size: 11px; color: var(--mustard); white-space: nowrap; }

  .rb-back { background: none; border: none; color: var(--muted); font-size: 14px; padding: 4px 0 2px; display: flex; align-items: center; gap: 4px; }
  .rb-back:active { color: var(--text); }

  .rb-recipe-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 22px; line-height: 1.25; margin: 10px 0 14px; }

  .rb-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .rb-stat { background: var(--surface); border-radius: 10px; padding: 9px 6px; text-align: center; }
  .rb-stat-num { font-size: 15px; font-weight: 600; color: var(--paprika); }
  .rb-stat-label { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .rb-stat-weight .rb-stat-num { color: #8fb3c9; }
  .rb-stat-kcal .rb-stat-num { color: var(--mustard); }
  .rb-stat-protein .rb-stat-num { color: #7fae62; }
  .rb-stat-carbs .rb-stat-num { color: var(--paprika); }
  .rb-stat-fat .rb-stat-num { color: #c9707a; }
  .rb-stat-cost .rb-stat-num { color: #6fa3a0; }
  .rb-per100 { font-size: 12px; color: var(--muted); text-align: center; margin: 8px 0 4px; }
  .rb-stats-grid-4 { grid-template-columns: repeat(4, 1fr); }
  .rb-stats-caption { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: center; margin: 0 0 8px; }
  .rb-ate-btn { display: block; width: 100%; margin: 12px 0 4px; padding: 12px; border: none; border-radius: 12px;
    background: var(--mustard); color: #211c14; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  .rb-log-hint { font-size: 12px; color: var(--muted); margin: 8px 0 2px; }
  .rb-weigh-line { font-size: 11.5px; color: var(--muted); text-align: center; margin: 2px 0 4px; }
  .rb-macro-btn { flex: none; background: none; border: none; font-size: 15px; line-height: 1; padding: 4px 6px;
    cursor: pointer; opacity: .45; filter: grayscale(1); }
  .rb-macro-btn.is-set { opacity: 1; filter: none; }
  .rb-scan-btn { display: block; width: 100%; margin: 10px 0 6px; padding: 12px; border: none; border-radius: 10px;
    background: var(--mustard); color: #211c14; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  .rb-scan-result { font-size: 12.5px; margin: 6px 0; padding: 8px 10px; border-radius: 8px; background: var(--bg); }
  .rb-scan-result.is-ok { color: var(--mustard); }
  .rb-scan-result.is-bad { color: #d79aa2; }
  .rb-scan { position: fixed; inset: 0; z-index: 90; background: #000; display: flex;
    flex-direction: column; align-items: center; justify-content: center; }
  .rb-scan-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .rb-scan-frame { position: relative; width: 74%; max-width: 330px; aspect-ratio: 3 / 2;
    border: 2px solid rgba(255,255,255,.9); border-radius: 14px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.55); }
  .rb-scan-msg { position: relative; color: #fff; font-size: 14px; text-align: center; margin: 20px 24px 0; }
  .rb-scan-actions { position: relative; display: flex; flex-direction: column; gap: 8px; margin-top: 18px; width: 74%; max-width: 330px; }
  .rb-scan-actions button { background: rgba(255,255,255,.14); color: #fff; }
  .rb-photo-btn { display: block; text-align: center; margin: 10px 0; padding: 11px; border-radius: 10px;
    border: 1px dashed rgba(201,160,74,.5); color: var(--mustard); font-size: 14px; cursor: pointer; }
  .rb-photo-input { display: none; }
  .rb-label-shot { display: block; width: 100%; max-height: 240px; object-fit: contain;
    border-radius: 10px; margin: 8px 0; background: #000; }
  .rb-macro-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 10px 0 2px; }
  .rb-macro-grid label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); }
  .rb-macro-grid input { padding: 9px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-family: inherit; font-size: 14px; width: 100%; }
  .rb-calc-btn { display: block; width: 100%; margin: 16px 0 4px; padding: 12px; border: none; border-radius: 12px;
    background: var(--surface); color: var(--mustard); border: 1px solid rgba(201,160,74,.45);
    font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  .rb-breakdown { margin: 12px 0 4px; padding: 12px; background: var(--surface); border-radius: 12px; }
  .rb-bd-head, .rb-bd-row { display: grid; grid-template-columns: 1fr 44px 50px 46px; gap: 6px; align-items: baseline; }
  .rb-bd-head { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
    padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .rb-bd-head span:not(:first-child), .rb-bd-row span:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
  .rb-bd-row { font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .rb-bd-row.is-unknown { opacity: .5; }
  .rb-bd-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rb-bd-tag { font-style: normal; font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase;
    color: var(--mustard); border: 1px solid rgba(201,160,74,.45); border-radius: 4px; padding: 1px 4px; margin-left: 4px; }
  .rb-bd-total { font-weight: 600; border-bottom: none; padding-top: 8px; }
  .rb-linkbtn { background: none; border: none; padding: 0; font-family: inherit; font-size: inherit;
    color: var(--mustard); text-decoration: underline; cursor: pointer; }
  .rb-intake-card { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; margin-bottom: 18px;
    padding: 14px; border: 1px solid rgba(201,160,74,.35); border-radius: 12px; background: var(--surface);
    color: inherit; font-family: inherit; cursor: pointer; }
  .rb-intake-main { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .rb-intake-title { font-size: 15px; font-weight: 600; color: var(--mustard); }
  .rb-intake-meta { font-size: 12.5px; color: var(--muted); }
  .rb-day-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .rb-day-nav button { width: 38px; height: 34px; border: none; border-radius: 9px; background: var(--surface);
    color: var(--text); font-size: 18px; cursor: pointer; }
  .rb-day-nav button:disabled { opacity: .3; cursor: default; }
  .rb-day-label { font-size: 15px; font-weight: 600; }
  .rb-goal { margin: 12px 0; }
  .rb-goal-head { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
  .rb-goal-track { height: 7px; border-radius: 4px; background: var(--surface); overflow: hidden; }
  .rb-goal-fill { height: 100%; background: var(--mustard); border-radius: 4px; }
  .rb-log-row { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .rb-log-main { flex: 1; }
  .rb-log-name { font-size: 14.5px; margin-bottom: 2px; }
  .rb-log-meta { font-size: 12px; color: var(--muted); }
  .rb-empty { font-size: 13.5px; color: var(--muted); padding: 10px 0; }
  .rb-log-recipe { width: 100%; padding: 10px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-family: inherit; font-size: 14px; }
  .rb-side-line { font-size: 12px; color: var(--muted); text-align: center; margin: 0 0 4px; line-height: 1.5; }
  .rb-combined-line { font-size: 12.5px; color: var(--mustard); text-align: center; margin: 4px 0 18px; line-height: 1.5; font-weight: 500; }

  .rb-servings-row { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border-radius: 12px; padding: 10px 14px; margin-bottom: 18px; }
  .rb-servings-label { font-size: 14px; font-weight: 500; }
  .rb-stepper { display: flex; align-items: center; gap: 14px; }
  .rb-stepper button {
    width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--mustard);
    background: none; color: var(--mustard); font-size: 17px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .rb-stepper button:disabled { opacity: 0.3; }
  .rb-stepper button:active:not(:disabled) { background: var(--mustard); color: var(--bg); }
  .rb-stepper-val { font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 600; min-width: 16px; text-align: center; }

  .rb-section-label { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 500; color: var(--mustard); margin: 0 0 4px; }
  .rb-ing-progress { font-size: 12px; color: var(--muted); margin-bottom: 8px; }

  .rb-ing-row { display: flex; align-items: center; gap: 11px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .rb-ing-check { position: absolute; opacity: 0; width: 20px; height: 20px; }
  .rb-box { width: 19px; height: 19px; border: 1.5px solid var(--muted); border-radius: 5px; flex-shrink: 0; position: relative; }
  .rb-ing-check:checked + .rb-box { background: var(--mustard); border-color: var(--mustard); }
  .rb-ing-check:checked + .rb-box::after {
    content: ''; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px;
    border: solid var(--bg); border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .rb-ing-text { font-size: 14.5px; line-height: 1.35; flex: 1; }
  .rb-ing-check:checked ~ .rb-ing-text { color: var(--muted); text-decoration: line-through; }
  .rb-ing-amt { font-weight: 600; color: var(--text); }
  .rb-ing-check:checked ~ .rb-ing-text .rb-ing-amt { color: var(--muted); }
  .rb-custom-remove { background: none; border: none; color: var(--muted); font-size: 17px; line-height: 1; padding: 0 2px; flex-shrink: 0; }

  .rb-add-row { display: flex; gap: 8px; margin-top: 12px; }
  .rb-add-input {
    flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; color: var(--text); font-size: 14px; font-family: inherit;
  }
  .rb-add-input::placeholder { color: var(--muted); }
  .rb-add-btn { background: var(--mustard); color: var(--bg); border: none; border-radius: 8px; padding: 0 16px; font-size: 14px; font-weight: 600; }

  .rb-side-picker-label { font-family: 'Fraunces', serif; font-size: 13px; color: var(--muted); margin: 0 0 8px; }
  .rb-side-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .rb-side-chip {
    padding: 7px 14px; border-radius: 20px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); font-size: 13px;
  }
  .rb-side-input-panel {
    background: var(--surface); border-radius: 12px; padding: 12px 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .rb-side-portion-btn {
    background: var(--mustard); color: var(--bg); border: none; border-radius: 8px;
    padding: 10px 12px; font-size: 13.5px; font-weight: 600; text-align: left;
  }
  .rb-side-manual-row { display: flex; gap: 8px; align-items: center; }
  .rb-side-manual-input {
    width: 80px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; color: var(--text); font-size: 14px; font-family: inherit;
  }
  .rb-side-manual-row span { font-size: 13px; color: var(--muted); }
  .rb-side-cancel { background: none; border: none; color: var(--muted); font-size: 12.5px; text-decoration: underline; padding: 0; align-self: flex-start; }
  .rb-side-added-sub { font-size: 11.5px; color: var(--muted); margin: 4px 0 0; }

  .rb-steps { list-style: none; padding: 0; margin: 0; }
  .rb-step { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .rb-step:last-child { border-bottom: none; }
  .rb-step-num {
    width: 22px; height: 22px; border-radius: 50%; background: var(--mustard); color: var(--bg);
    font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .rb-step-text { font-size: 14.5px; line-height: 1.55; }

  .rb-reset-row { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; }
  .rb-reset { background: none; border: none; color: var(--muted); font-size: 12.5px; text-decoration: underline; padding: 0; }
  .rb-reset:disabled { color: rgba(168,154,130,0.4); text-decoration: none; cursor: default; }
</style>
</head>
<body>
<div id="rb-root">
  <div class="rb-header">
    <p class="rb-title" id="rb-header-title">Blaze's Cook Book</p>
    <p class="rb-subtitle" id="rb-header-sub">20 recipes from the batch-cooking system</p>
  </div>
  <div class="rb-body" id="rb-body"></div>
</div>
<script>
(function(){
  const CATS = ["Breakfasts", "Protein Mains", "Protein Boosters", "Veg Mains", "Weekend Feasts"];

  const GF = {
    onion: 150, tomato: 120, garlicClove: 3, garlicPowderTsp: 3, gingerPowderTsp: 2, banana: 118,
    egg: 50, bread: 30, brinjal: 450, can: 120, tomatoPureeTbsp: 16,
    tspSpice: 3, tbspSpice: 9, tspOil: 4.5, tbspOil: 13.5, ml: 1
  };
  // Blaze's puree is a strained-tomato carton (27 kcal/100g), not a concentrate, so it
  // swaps in at roughly its own weight rather than the 1.5 tbsp a paste would need.
  const TOMATO_PUREE_TBSP_PER_UNIT = GF.tomato / GF.tomatoPureeTbsp;

  const NUT = {
    egg:{kcal:155,p:12.6,c:1.1,f:10.6}, bread:{kcal:265,p:9,c:49,f:3.2}, milk:{kcal:61,p:3.2,c:4.8,f:3.3},
    onion:{kcal:40,p:1.1,c:9.3,f:0.1}, tomato:{kcal:27,p:1.5,c:3.8,f:0.5}, garlic:{kcal:149,p:6.4,c:33,f:0.5},
    tomato_puree:{kcal:27,p:1.5,c:3.8,f:0.5},
    cumin:{kcal:375,p:17.8,c:44.2,f:22.3}, turmeric:{kcal:312,p:9.7,c:67.1,f:3.3}, chili:{kcal:282,p:13.5,c:49.7,f:14.3},
    coriander_powder:{kcal:298,p:12.4,c:55,f:17.8}, garam_masala:{kcal:300,p:12,c:50,f:15}, salt:{kcal:0,p:0,c:0,f:0},
    oil:{kcal:884,p:0,c:0,f:100}, chicken:{kcal:120,p:22.5,c:0,f:2.6}, rice_cooked:{kcal:130,p:2.7,c:28,f:0.3},
    dal_cooked:{kcal:116,p:9,c:20,f:0.4}, lentils_dry:{kcal:352,p:24,c:60,f:1.1}, spinach:{kcal:23,p:2.9,c:3.6,f:0.4},
    peas:{kcal:81,p:5.4,c:14.5,f:0.4}, broccoli:{kcal:34,p:2.8,c:6.6,f:0.4}, cauliflower:{kcal:25,p:1.9,c:5,f:0.3},
    cabbage:{kcal:25,p:1.3,c:5.8,f:0.1}, carrot:{kcal:41,p:0.9,c:9.6,f:0.2}, potato:{kcal:77,p:2,c:17,f:0.1},
    brinjal:{kcal:25,p:1,c:6,f:0.2}, mackerel:{kcal:205,p:19,c:0,f:13.9}, pasta_dry:{kcal:371,p:13,c:75,f:1.5},
    beans_cooked:{kcal:143,p:9,c:26.2,f:0.65}, beans_dry:{kcal:347,p:21,c:63,f:1.2}, water:{kcal:0,p:0,c:0,f:0},
    kidney_beans_canned:{kcal:117,p:8.4,c:15,f:1},
    couscous_dry:{kcal:376,p:12.8,c:77.4,f:0.6}, semolina_dry:{kcal:360,p:12.7,c:72.8,f:1.1}, tortilla:{kcal:310,p:8,c:50,f:7},
    potato_baked:{kcal:93,p:2.1,c:21.1,f:0.1}, beef:{kcal:250,p:26,c:0,f:15},
    black_pepper:{kcal:251,p:10.4,c:63.9,f:3.3}, rice_dry:{kcal:350,p:7.5,c:78,f:0.5},
    banana:{kcal:89,p:1.1,c:22.8,f:0.3}, whey:{kcal:400,p:80,c:6.7,f:5},
    tuna_canned:{kcal:130,p:26,c:0,f:1}, cottage_cheese:{kcal:98,p:11,c:3.4,f:4.3}, grilling_cheese:{kcal:320,p:22,c:2,f:25},
    flour:{kcal:364,p:10.3,c:76.3,f:1}
  };


  // side-dish options offered when a recipe has no single-pot carb of its own
  const SIDE_TYPES = [
    { key:"rice", label:"Rice", nut:"rice_cooked", portion:150, note:"cooked" },
    { key:"potato", label:"Potato", nut:"potato_baked", portion:180, note:"baked, with salt" },
    { key:"bread", label:"Bread", nut:"bread", portion:60, note:"~2 slices" },
    { key:"pasta", label:"Pasta", nut:"pasta_dry", portion:80, note:"dry" },
    { key:"couscous", label:"Couscous", nut:"couscous_dry", portion:80, note:"dry" },
    { key:"semolina", label:"Semolina", nut:"semolina_dry", portion:60, note:"dry" },
    { key:"tortilla", label:"Tortilla", nut:"tortilla", portion:50, note:"~1 piece" }
  ];
  const sideTypeByKey = {};
  SIDE_TYPES.forEach(s => sideTypeByKey[s.key] = s);

  function getNutKey(ing) {
    if (ing.type === "onion") return "onion";
    if (ing.type === "banana") return "banana";
    if (ing.type === "tomato") return "tomato";
    if (ing.type === "garlic") return "garlic";
    if (ing.type === "egg") return "egg";
    if (ing.type === "bread") return "bread";

  function isOil(ing) { return /\boil\b/i.test(ing.n); }

  function trueGrams(ing, amount) {
    if (ing.type === "onion") return amount * GF.onion;
    if (ing.type === "banana") return amount * GF.banana;
    if (ing.type === "tomato") return amount * GF.tomato;
    if (ing.type === "garlic") return amount * GF.garlicClove;
    if (ing.type === "egg") return amount * GF.egg;
    if (ing.type === "bread") return amount * GF.bread;
    if (ing.type === "brinjal") return amount * GF.brinjal;
    if (ing.type === "can") return amount * GF.can;
    if (ing.type === "tuna_can") return amount * GF.can;
    if (ing.u === "g") return amount;
    if (ing.u === "ml") return amount * GF.ml;
    if (ing.u === "tsp") return amount * (isOil(ing) ? GF.tspOil : GF.tspSpice);
    if (ing.u === "tbsp") return amount * (isOil(ing) ? GF.tbspOil : GF.tbspSpice);
    return 0;
  }

  function emptyNut() { return { totalG: 0, kcal: 0, p: 0, c: 0, f: 0 }; }
  // Per-100g values for an ingredient: a measured override from the actual packet
  // beats the built-in reference table.
  function nutFor(ing) {
    if (ing._macro) return ing._macro;
    const key = getNutKey(ing);
    return key && NUT[key] ? NUT[key] : null;
  }
  function addToNut(acc, ing, amt) {
    const g = trueGrams(ing, amt);
    acc.totalG += g;
    const n = nutFor(ing);
    if (n) {
      acc.kcal += g * n.kcal / 100; acc.p += g * n.p / 100; acc.c += g * n.c / 100; acc.f += g * n.f / 100;
    }
  }
  // applies per-recipe user overrides (removed ingredients, edited quantities) to the
  // recipe's base ingredient list, carrying the original array index along as _idx
  function effectiveIngredients(r, overrides, macros) {
    const ov = overrides || {};
    const mc = macros || {};
    const out = [];
    r.ingredients.forEach((ing, idx) => {
      const o = ov[idx];
      if (o && o.removed) return;
      const extra = { _idx: idx };
      if (mc[idx]) extra._macro = mc[idx];
      if (o && o.amount !== undefined) extra.a = o.amount;
      out.push(Object.assign({}, ing, extra));
    });
    return out;
  }
  // main-dish nutrition only -- single-pot carbs (fried rice, pasta bolognese) are already
  // ordinary ingredients here and count normally; there is no separate "side" ingredient anymore
  function computeNutrition(r, scale, overrides, macros) {
    const main = emptyNut();
    effectiveIngredients(r, overrides, macros).forEach(ing => {
      if (ing.a === null) return;
      addToNut(main, ing, ing.a * scale);
    });
    return main;
  }
  // per-ingredient contribution, so the totals can be shown as a breakdown
  function nutritionBreakdown(r, scale, overrides, macros) {
    return effectiveIngredients(r, overrides, macros).map(ing => {
      if (ing.a === null) return null;
      const amt = ing.a * scale;
      const g = trueGrams(ing, amt);
      const n = nutFor(ing);
      return {
        idx: ing._idx,
        name: baseLabel(ing),
        g: g,
        measured: !!ing._macro,
        known: !!n,
        kcal: n ? g * n.kcal / 100 : 0,
        p: n ? g * n.p / 100 : 0,
        c: n ? g * n.c / 100 : 0,
        f: n ? g * n.f / 100 : 0
      };
    }).filter(Boolean).sort((a, b) => b.kcal - a.kcal);
  }
  function computeSideNut(sideSel) {
    const out = emptyNut();
    if (!sideSel) return out;
    const cfg = sideTypeByKey[sideSel.type];
    if (!cfg) return out;
    const n = NUT[cfg.nut];
    const g = sideSel.grams;
    out.totalG = g; out.kcal = g * n.kcal / 100; out.p = g * n.p / 100; out.c = g * n.c / 100; out.f = g * n.f / 100;
    return out;
  }

  async function loadState() {
    try {

    } catch (e) { state = {}; }

  // ---- barcode scanning + Open Food Facts -------------------------------
  // Packaged food carries its own identifier, so reading the barcode beats
  // reading the label: exact figures, no OCR guesswork. Looked-up products are
  // cached locally, so a repeat scan of the same tin works with no signal.
  const OFF_URL = "https://world.openfoodfacts.org/api/v2/product/";

  function getBarcodeCache() {
    if (!state._barcodes) state._barcodes = {};
    return state._barcodes;
  }

  function nutrimentsToMacros(n) {
    if (!n) return null;
    const num = v => (typeof v === "number" && isFinite(v) && v >= 0) ? v : null;
    let kcal = num(n["energy-kcal_100g"]);
    if (kcal === null) {
      const kj = num(n["energy_100g"]) ?? num(n["energy-kj_100g"]);
      if (kj !== null) kcal = kj / 4.184;
    }
    const pr = num(n["proteins_100g"]);
    const cb = num(n["carbohydrates_100g"]);
    const ft = num(n["fat_100g"]);
    if (kcal === null && pr === null && cb === null && ft === null) return null;
    return {
      kcal: kcal === null ? 0 : Math.round(kcal * 10) / 10,
      p: pr === null ? 0 : Math.round(pr * 10) / 10,
      c: cb === null ? 0 : Math.round(cb * 10) / 10,
      f: ft === null ? 0 : Math.round(ft * 10) / 10
    };
  }

  async function lookupBarcode(code) {
    const cache = getBarcodeCache();
    if (cache[code]) return cache[code];
    let res;
    try {
      res = await fetch(OFF_URL + encodeURIComponent(code) + ".json?fields=product_name,brands,nutriments",
        { headers: { "Accept": "application/json" } });
    } catch (e) {
      throw new Error("offline");
    }
    if (!res.ok) throw new Error("offline");
    const j = await res.json();
    const prod = j && j.product;
    if (!prod || (j.status !== undefined && j.status !== 1 && !prod.nutriments)) throw new Error("notfound");
    const macros = nutrimentsToMacros(prod.nutriments);
    if (!macros) throw new Error("nonutrition");
    const name = [prod.brands, prod.product_name].filter(Boolean).join(" — ") || ("Barcode " + code);
    const entry = Object.assign({ name: name, code: code }, macros);
    cache[code] = entry;
    saveState();
    return entry;
  }

  function barcodeSupported() {
    return typeof window.BarcodeDetector === "function";
  }

  // Full-screen scanner overlay. It lives outside the re-rendered body so a
  // render() mid-scan cannot tear the camera down.
  function openScanner(onCode) {
    const wrap = document.createElement("div");
    wrap.className = "rb-scan";
    wrap.innerHTML =
      '<video class="rb-scan-video" playsinline muted></video>' +
      '<div class="rb-scan-frame"></div>' +
      '<p class="rb-scan-msg">Point the camera at the barcode</p>' +
      '<div class="rb-scan-actions">' +
        '<button class="rb-side-cancel rb-scan-type" type="button">Type the number instead</button>' +
        '<button class="rb-side-cancel rb-scan-close" type="button">Cancel</button>' +
      '</div>';
    document.body.appendChild(wrap);

    const video = wrap.querySelector(".rb-scan-video");
    const msg = wrap.querySelector(".rb-scan-msg");
    let stream = null, raf = 0, done = false;

    function close() {
      if (done) return;
      done = true;
      if (raf) cancelAnimationFrame(raf);
      if (stream) stream.getTracks().forEach(t => t.stop());
      wrap.remove();
    }
    function finish(code) {
      if (done) return;
      close();
      onCode(code);
    }

    wrap.querySelector(".rb-scan-close").addEventListener("click", close);
    wrap.querySelector(".rb-scan-type").addEventListener("click", () => {
      const typed = prompt("Barcode number (the digits under the bars):");
      if (typed && typed.trim()) finish(typed.trim().replace(/\s/g, ""));
      else close();
    });

    if (!barcodeSupported()) {
      msg.textContent = "This browser cannot scan barcodes — type the number instead.";
      return;
    }

    const detector = new window.BarcodeDetector({
      formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39"]
    });

    // The detect loop must not be gated on play() resolving: under autoplay
    // policies that promise can reject or never settle, which would leave the
    // scanner showing a live picture while silently detecting nothing.
    function startDetecting() {
      if (done || raf) return;
      const started = Date.now();
      const tick = () => {
        if (done) return;
        if (Date.now() - started > 25000) {
          msg.textContent = "Still no barcode — try better light, or type the number.";
        }
        detector.detect(video)
          .then(codes => {
            if (done) return;
            if (codes && codes.length && codes[0].rawValue) finish(codes[0].rawValue);
            else raf = requestAnimationFrame(tick);
          })
          .catch(() => { if (!done) raf = requestAnimationFrame(tick); });
      };
      raf = requestAnimationFrame(tick);
    }

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(st => {
        if (done) { st.getTracks().forEach(t => t.stop()); return; }
        stream = st;
        video.srcObject = st;
        video.addEventListener("loadedmetadata", startDetecting, { once: true });
        const p = video.play();
        if (p && p.catch) p.catch(() => {});
        startDetecting();
      })
      .catch(() => {
        if (done) return;
        msg.textContent = "No camera access — type the number instead.";
      });
  }

  // ---- label photos -----------------------------------------------------
  // Photos live in IndexedDB, not localStorage: a handful of label shots would
  // blow the ~5MB string quota that holds all the rest of the app state.
  const PHOTO_DB = "blaze-cookbook-photos";
  let photoDbPromise = null;
  function photoDb() {
    if (photoDbPromise) return photoDbPromise;
    photoDbPromise = new Promise((resolve, reject) => {
      let req;
      try { req = indexedDB.open(PHOTO_DB, 1); } catch (e) { reject(e); return; }
      req.onupgradeneeded = () => {
        if (!req.result.objectStoreNames.contains("photos")) req.result.createObjectStore("photos");
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    }).catch(() => null);
    return photoDbPromise;
  }
  async function photoPut(key, dataUrl) {
    const db = await photoDb();
    if (!db) return false;
    return new Promise(res => {
      try {
        const tx = db.transaction("photos", "readwrite");
        tx.objectStore("photos").put(dataUrl, key);
        tx.oncomplete = () => res(true);
        tx.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  }
  async function photoGet(key) {
    const db = await photoDb();
    if (!db) return null;
    return new Promise(res => {
      try {
        const tx = db.transaction("photos", "readonly");
        const rq = tx.objectStore("photos").get(key);
        rq.onsuccess = () => res(rq.result || null);
        rq.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  }
  async function photoDel(key) {
    const db = await photoDb();
    if (!db) return;
    try {
      const tx = db.transaction("photos", "readwrite");
      tx.objectStore("photos").delete(key);
    } catch (e) {}
  }
  // shrink before storing — a phone camera shot is several MB and a label only
  // needs to stay readable
  function shrinkImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onerror = () => reject(new Error("read failed"));
      fr.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error("decode failed"));
        img.onload = () => {
          let { width: w, height: h } = img;
          const scale = Math.min(1, maxDim / Math.max(w, h));
          w = Math.round(w * scale); h = Math.round(h * scale);
          const cv = document.createElement("canvas");
          cv.width = w; cv.height = h;
          cv.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(cv.toDataURL("image/jpeg", quality));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  function photoKey(recipeId, idx) { return recipeId + ":" + idx; }

  // ---- daily intake log -------------------------------------------------
  // state._intake = { "YYYY-MM-DD": [ {id, name, g, kcal, p, c, f} ] }
  // state._goals  = { kcal, p }   (0 / missing = no goal set)
  function todayKey(d) {
    const dt = d || new Date();
    return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");
  }
  function getIntake() {
    if (!state._intake) state._intake = {};
    return state._intake;
  }
  function getDayLog(key) {
    const all = getIntake();
    if (!all[key]) all[key] = [];
    return all[key];
  }
  function getGoals() {
    if (!state._goals) state._goals = { kcal: 0, p: 0 };
    return state._goals;
  }
  function dayTotals(key) {
    const t = { kcal: 0, p: 0, c: 0, f: 0, g: 0 };
    getDayLog(key).forEach(e => {
      t.kcal += e.kcal; t.p += e.p; t.c += e.c; t.f += e.f; t.g += e.g;
    });
    return t;
  }
  // Weight the per-100g maths should divide by. Raw ingredient weight counts
  // water that mostly boils off, so a weighed cooked batch is far more accurate
  // — if one has been recorded, it wins.
  function effectiveWeight(r, scale, rawTotalG) {
    const st = getRecipeState(r.id);
    return st.cookedG ? st.cookedG * scale : rawTotalG;
  }
  // per-100g profile of a recipe as it is currently configured (edits included)
  function recipePer100(r) {
    const st = getRecipeState(r.id);
    const n = computeNutrition(r, 1, st.overrides, st.macros);
    const w = effectiveWeight(r, 1, n.totalG);
    if (!w) return { kcal: 0, p: 0, c: 0, f: 0 };
    return {
      kcal: n.kcal / w * 100, p: n.p / w * 100,
      c: n.c / w * 100, f: n.f / w * 100
    };
  }
  function logIntake(recipeId, grams) {
    const r = byId[recipeId];
    if (!r || !grams || grams <= 0) return;
    const per = recipePer100(r);
    const mult = grams / 100;
    getDayLog(viewDate).push({
      id: Date.now(), name: r.title, g: grams,
      kcal: per.kcal * mult, p: per.p * mult, c: per.c * mult, f: per.f * mult
    });
    saveState();
  }

  function getRecipeState(id) {
    if (!state[id]) state[id] = { servings: 1, checked: {}, custom: [], customSeq: 0, side: null, overrides: {}, macros: {} };
    if (!state[id].custom) state[id].custom = [];
    if (state[id].customSeq === undefined) state[id].customSeq = 0;
    if (state[id].side === undefined) state[id].side = null;
    if (!state[id].overrides) state[id].overrides = {};
    if (!state[id].macros) state[id].macros = {};
    return state[id];
  }

  const FRACS = [
    [0.125, "\u215B"], [0.25, "\u00BC"], [0.333, "\u2153"], [0.375, "\u215C"],
    [0.5, "\u00BD"], [0.625, "\u215D"], [0.667, "\u2154"], [0.75, "\u00BE"], [0.875, "\u215E"]
  ];
  function fmtAmount(n) {
    if (n === null || n === undefined) return "";
    let whole = Math.floor(n + 1e-6);
    let frac = n - whole;
    if (frac < 0.03) return String(whole);
    let best = null, bestDiff = 1;
    FRACS.forEach(([v, sym]) => { const d = Math.abs(frac - v); if (d < bestDiff) { bestDiff = d; best = sym; } });
    if (bestDiff < 0.045) return whole === 0 ? best : whole + best;
    return String(Math.round(n * 100) / 100);
  }
  function fmt1(n) {
    const r = Math.round(n * 10) / 10;
    return r % 1 === 0 ? String(r) : r.toFixed(1);
  }
  function formatWeight(g) {
    let r;
    if (g < 20) r = Math.round(g * 2) / 2;
    else if (g < 1000) r = Math.round(g / 5) * 5;
    else return (Math.round((g / 1000) * 100) / 100) + " kg";
    if (r <= 0) r = 0.5;
    return (r % 1 === 0 ? r : r.toFixed(1)) + " g";
  }

  function gramsForPlain(ing, amount) {
    if (ing.type === "onion") return amount * GF.onion;
    if (ing.type === "banana") return amount * GF.banana;
    if (ing.type === "tomato") return amount * GF.tomato;
    if (ing.type === "egg") return amount * GF.egg;
    if (ing.type === "bread") return amount * GF.bread;
    if (ing.type === "brinjal") return amount * GF.brinjal;
    if (ing.type === "can") return amount * GF.can;
    if (ing.type === "tuna_can") return amount * GF.can;
    if (ing.u === "g") return amount;
    if (ing.u === "ml") return amount * GF.ml;
    if (ing.u === "tsp") return amount * (isOil(ing) ? GF.tspOil : GF.tspSpice);
    if (ing.u === "tbsp") return amount * (isOil(ing) ? GF.tbspOil : GF.tbspSpice);
    return null;
  }

  function baseLabel(ing) {
    if (ing.type === "onion") return "onion" + (ing.note ? ", " + ing.note : "");
    if (ing.type === "banana") return "banana";
    if (ing.type === "tomato") return "tomato" + (ing.note ? ", " + ing.note : "");
    if (ing.type === "bread") return "bread";
    if (ing.type === "tuna_can") return "tuna, drained";
    if (ing.type === "brinjal") return "brinjal";
    return ing.n;
  }

  function buildRows(r, scale, prefs, overrides) {
    const rows = [];
    effectiveIngredients(r, overrides).forEach(ing => {
      const idx = ing._idx;
      if (ing.type === "garlic") {
        const cloves = ing.a * scale;
        let html;
        if (prefs.powder) {
          const tsp = cloves * 0.125;
          if (prefs.weight) html = `<span class="rb-ing-amt">${formatWeight(tsp * GF.garlicPowderTsp)}</span> garlic powder`;
          else html = `<span class="rb-ing-amt">${fmtAmount(tsp)} tsp</span> garlic powder`;
        } else {
          if (prefs.weight) html = `<span class="rb-ing-amt">${formatWeight(cloves * GF.garlicClove)}</span> garlic${ing.note ? ", " + ing.note : ""}`;
          else html = `<span class="rb-ing-amt">${fmtAmount(cloves)}${ing.u ? " " + ing.u : ""}</span> ${ing.n}`;
        }
        rows.push({ key: String(idx), html, editIdx: idx });
        if (prefs.powder) {
          const tsp = cloves * 0.125;
          let gHtml;
          if (prefs.weight) gHtml = `<span class="rb-ing-amt">${formatWeight(tsp * GF.gingerPowderTsp)}</span> ginger powder`;
          else gHtml = `<span class="rb-ing-amt">${fmtAmount(tsp)} tsp</span> ginger powder`;
          rows.push({ key: idx + "_ginger", html: gHtml });
        }
        return;
      }
      if (ing.type === "tomato" && prefs.tomatoPuree) {
        const units = ing.a * scale;
        const tbsp = units * TOMATO_PUREE_TBSP_PER_UNIT;
        let html;
        if (prefs.weight) html = `<span class="rb-ing-amt">${formatWeight(tbsp * GF.tomatoPureeTbsp)}</span> tomato puree`;
        else html = `<span class="rb-ing-amt">${fmtAmount(tbsp)} tbsp</span> tomato puree`;
        rows.push({ key: String(idx), html, editIdx: idx });
        return;
      }
      if (ing.a === null) { rows.push({ key: String(idx), html: ing.n, editIdx: idx }); return; }
      const scaled = ing.a * scale;
      if (prefs.weight) {
        const g = gramsForPlain(ing, scaled);
        if (g !== null) {
          rows.push({ key: String(idx), html: `<span class="rb-ing-amt">${formatWeight(g)}</span> ${baseLabel(ing)}`, editIdx: idx });
          return;
        }
      }
      rows.push({ key: String(idx), html: `<span class="rb-ing-amt">${fmtAmount(scaled)}${ing.u ? " " + ing.u : ""}</span> ${ing.n}`, editIdx: idx });
    });
    return rows;
  }

  function totalRowCount(r, prefs, st) {

    return base + (prefs.powder ? garlicCount : 0) + st.custom.length + (st.side ? 1 : 0);
  }

  function prettyDate(key) {
    const [y, m, d] = key.split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    const t = todayKey();
    if (key === t) return "Today";
    const yd = new Date(); yd.setDate(yd.getDate() - 1);
    if (key === todayKey(yd)) return "Yesterday";
    return dt.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  }
  function shiftDate(key, days) {
    const [y, m, d] = key.split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    dt.setDate(dt.getDate() + days);
    return todayKey(dt);
  }

      ? "\u20AC" + (r.price * scale).toFixed(2) + (r.tracked ? " (tracked)" : "")

    const per100 = dishG > 0 ? {
      kcal: main.kcal / dishG * 100, p: main.p / dishG * 100,

          <p class="rb-log-hint">At ${Math.round(per100.kcal)} kcal / 100 g. One whole batch is ${Math.round(dishG)}g.</p>
          <button class="rb-side-portion-btn" data-log-save="${r.id}" type="button">Log it</button>
          <button class="rb-side-cancel" data-log-cancel="1" type="button">Cancel</button>
        </div>`
      : `<button class="rb-ate-btn" data-log-open="${r.id}" type="button">+ &nbsp;Log what I ate</button>`}
      <p class="rb-per100">Whole batch \u2014 ${Math.round(dishG)}g &nbsp;\u00B7&nbsp; ${Math.round(main.kcal)} kcal &nbsp;\u00B7&nbsp; ${Math.round(main.p)}g protein &nbsp;\u00B7&nbsp; ${Math.round(main.c)}g carbs &nbsp;\u00B7&nbsp; ${Math.round(main.f)}g fat &nbsp;\u00B7&nbsp; ${priceStr}</p>
      ${weighEditing === r.id ? `
        <div class="rb-side-input-panel">
          <p class="rb-side-picker-label" style="margin:0 0 8px;">Actual weight of the cooked batch</p>
          <div class="rb-side-manual-row">
            <input type="number" min="0" step="any" class="rb-cooked-input" value="${st.cookedG ? Math.round(st.cookedG * scale) : ""}" placeholder="grams">
            <span>g</span>
          </div>
          <p class="rb-log-hint">Weigh the pot contents once after cooking. Raw ingredients come to ${Math.round(main.totalG)}g, but water boils off \u2014 the weighed figure makes every logged portion accurate.</p>
          <button class="rb-side-portion-btn" data-cooked-save="${r.id}" type="button">Save</button>
          ${st.cookedG ? `<button class="rb-side-cancel" data-cooked-clear="${r.id}" type="button">Use raw weight instead</button>` : ""}
          <button class="rb-side-cancel" data-cooked-cancel="1" type="button">Cancel</button>
        </div>`
      : `<p class="rb-weigh-line">${st.cookedG
          ? `Using your weighed cooked batch. <button class="rb-linkbtn" data-cooked-edit="${r.id}" type="button">Change</button>`
          : `Based on raw ingredient weight. <button class="rb-linkbtn" data-cooked-edit="${r.id}" type="button">Weighed it after cooking?</button>`}</p>`}
      ${hasSide ? `<p class="rb-combined-line">Meal total incl. side: ${Math.round(combined.totalG)}g &nbsp;\u00B7&nbsp; ${Math.round(combined.kcal)} kcal &nbsp;\u00B7&nbsp; ${Math.round(combined.p)}g protein &nbsp;\u00B7&nbsp; ${Math.round(combined.c)}g carbs &nbsp;\u00B7&nbsp; ${Math.round(combined.f)}g fat</p>` : `<div style="margin-bottom:18px;"></div>`}

      <div class="rb-servings-row">
        <span class="rb-servings-label">Servings</span>
        <div class="rb-stepper">
          <button data-dec="1" ${st.servings <= 1 ? "disabled" : ""}>\u2212</button>
          <span class="rb-stepper-val">${st.servings}</span>
          <button data-inc="1" ${st.servings >= 10 ? "disabled" : ""}>+</button>
        </div>
      </div>

      ${miniTogglePanelHtml(hasGarlic, hasTomato)}

      <h3 class="rb-section-label">Ingredients</h3>
      <p class="rb-ing-progress">${doneCount} of ${total} ready</p>
      ${mainIngHtml}
      ${removedHtml}
      ${customHtml}
      <div class="rb-add-row">
        <input type="text" class="rb-add-input" placeholder="Add an ingredient…">
        <button class="rb-add-btn" data-add-ing="1" type="button">Add</button>
      </div>
      <button class="rb-calc-btn" data-calc="1" type="button">${calcFlash === r.id ? "✓ &nbsp;Recalculated" : "Calculate macros"}</button>
      <p class="rb-weigh-line">${measuredCount
        ? `${measuredCount} of ${countableIng} ingredients using your own packet values; the rest use general ones.`
        : `All ingredients using general values. Tap 🏷 on any one to enter what the packet says.`}</p>

      ${showBreakdown ? `
        <div class="rb-breakdown">
          <div class="rb-bd-head"><span>ingredient</span><span>g</span><span>kcal</span><span>prot</span></div>
          ${breakdown.map(b => `
            <div class="rb-bd-row${b.known ? "" : " is-unknown"}">
              <span class="rb-bd-name">${b.name}${b.measured ? ' <i class="rb-bd-tag">yours</i>' : ""}${b.known ? "" : ' <i class="rb-bd-tag">no data</i>'}</span>
              <span>${Math.round(b.g)}</span>
              <span>${Math.round(b.kcal)}</span>
              <span>${fmt1(b.p)}</span>
            </div>`).join("")}
          <div class="rb-bd-row rb-bd-total">
            <span class="rb-bd-name">Total</span>
            <span>${Math.round(main.totalG)}</span>
            <span>${Math.round(main.kcal)}</span>
            <span>${fmt1(main.p)}</span>
          </div>
          <p class="rb-log-hint">Divided by the ${st.cookedG ? "weighed cooked" : "raw"} batch weight of ${Math.round(dishG)}g, that is ${Math.round(per100.kcal)} kcal and ${fmt1(per100.p)}g protein per 100g.</p>
        </div>` : ""}

      <div class="rb-reset-row">
        <button class="rb-reset" data-breakdown="1">${showBreakdown ? "Hide" : "Show"} the maths</button>
        <button class="rb-reset" data-reset="1" ${doneCount === 0 ? "disabled" : ""}>Uncheck all</button>
        <button class="rb-reset" data-reset-ingredients="1" ${hasEdits ? "" : "disabled"}>Reset ingredients to default</button>
      </div>

      ${renderSideSection(r, st)}

      <h3 class="rb-section-label" style="margin-top:22px;">Method</h3>
      ${stepsHtml}
    `;
  }

  function r_byId(id) { return byId[id]; }

  function render() {
    if (view === "intake") renderIntake();
    else if (currentId) renderRecipe(currentId);
    else renderHome();
  }

  // In-app navigation history, so the phone's back button/gesture steps back
  // through the app (recipe -> home) instead of closing it outright.
  function openRecipe(id) {
    currentId = id;
    view = "recipe";
    logPicking = null;
    weighEditing = null;
    macroEditing = null;
    history.pushState({ rb: "recipe", id }, "", "#" + id);
    render();
    body.scrollTo(0, 0);
  }
  function openIntake() {
    currentId = null;
    view = "intake";
    logPicking = null;
    weighEditing = null;
    macroEditing = null;
    goalEditing = false;
    viewDate = todayKey();
    history.pushState({ rb: "intake" }, "", "#intake");
    render();
    body.scrollTo(0, 0);
  }
  function goHome(fromPop) {
    currentId = null;
    view = "home";
    logPicking = null;
    weighEditing = null;
    macroEditing = null;
    if (!fromPop) history.pushState({ rb: "home" }, "", location.pathname + location.search);
    render();
    body.scrollTo(0, 0);
  }
  window.addEventListener("popstate", (e) => {
    const st = e.state;
    logPicking = null;
    weighEditing = null;
    macroEditing = null;
    if (st && st.rb === "recipe" && byId[st.id]) { currentId = st.id; view = "recipe"; }
    else if (st && st.rb === "intake") { currentId = null; view = "intake"; viewDate = viewDate || todayKey(); }
    else { currentId = null; view = "home"; }
    render();
  });

  function tryAddIngredient() {
    if (!currentId) return;
    const input = body.querySelector(".rb-add-input");
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;
    const st = getRecipeState(currentId);
    st.customSeq++;
    st.custom.push({ id: st.customSeq, text });
    saveState();
    render();
  }

  function commitSide(type, grams) {
    if (!currentId || !grams || grams <= 0) return;
    const st = getRecipeState(currentId);
    st.side = { type, grams };
    delete sidePicking[currentId];
    saveState();
    render();
  }

  root.addEventListener("click", (e) => {
    const openBtn = e.target.closest("[data-open]");
    if (openBtn) { openRecipe(openBtn.getAttribute("data-open")); return; }

    const backBtn = e.target.closest("[data-back]");
    if (backBtn) { history.back(); return; }

    const intakeBtn = e.target.closest("[data-intake]");
    if (intakeBtn) { openIntake(); return; }

    const dayBtn = e.target.closest("[data-day]");
    if (dayBtn && !dayBtn.disabled) {
      const next = shiftDate(viewDate, Number(dayBtn.getAttribute("data-day")));
      if (next <= todayKey()) { viewDate = next; logPicking = null; render(); }
      return;
    }

    const logOpenBtn = e.target.closest("[data-log-open]");
    if (logOpenBtn) { logPicking = logOpenBtn.getAttribute("data-log-open"); render(); return; }

    const logCancelBtn = e.target.closest("[data-log-cancel]");
    if (logCancelBtn) { logPicking = null; render(); return; }

    const logSaveBtn = e.target.closest("[data-log-save]");
    if (logSaveBtn) {
      const which = logSaveBtn.getAttribute("data-log-save");
      const gInput = body.querySelector(".rb-log-grams");
      const grams = gInput ? parseFloat(gInput.value) : NaN;
      if (isNaN(grams) || grams <= 0) return;
      let rid = which;
      if (which === "__intake__") {
        const sel = body.querySelector(".rb-log-recipe");
        rid = sel ? sel.value : null;
      } else if (view !== "intake") {
        viewDate = todayKey();
      }
      if (rid) {
        logIntake(rid, grams);
        logPicking = null;
        if (view === "intake") render();
        else openIntake();
      }
      return;
    }

    const logDelBtn = e.target.closest("[data-log-del]");
    if (logDelBtn) {
      const eid = Number(logDelBtn.getAttribute("data-log-del"));
      const all = getIntake();
      all[viewDate] = getDayLog(viewDate).filter(x => x.id !== eid);
      saveState(); render(); return;
    }

    const macroIngBtn = e.target.closest("[data-macro-ing]");
    if (macroIngBtn && currentId) {
      const idx = Number(macroIngBtn.getAttribute("data-macro-ing"));
      macroEditing = { id: currentId, idx: idx, photo: null };
      render();
      photoGet(photoKey(currentId, idx)).then(url => {
        if (url && macroEditing && macroEditing.id === currentId && macroEditing.idx === idx) {
          macroEditing.photo = url; render();
        }
      });
      return;
    }
    const scanBtn = e.target.closest("[data-scan-for]");
    if (scanBtn && currentId && macroEditing) {
      const target = { id: macroEditing.id, idx: macroEditing.idx };
      openScanner(code => {
        if (!macroEditing || macroEditing.id !== target.id || macroEditing.idx !== target.idx) return;
        macroEditing.scanMsg = "Looking up " + code + "…";
        macroEditing.scanOk = true;
        render();
        lookupBarcode(code).then(entry => {
          if (!macroEditing || macroEditing.id !== target.id || macroEditing.idx !== target.idx) return;
          macroEditing.scanned = { kcal: entry.kcal, p: entry.p, c: entry.c, f: entry.f };
          macroEditing.scanMsg = entry.name + " — check the numbers, then save.";
          macroEditing.scanOk = true;
          render();
        }).catch(err => {
          if (!macroEditing || macroEditing.id !== target.id || macroEditing.idx !== target.idx) return;
          const why = err && err.message;
          macroEditing.scanMsg =
            why === "notfound" ? "Barcode " + code + " isn't in the food database — type the values from the label."
            : why === "nonutrition" ? "That product is listed but has no nutrition figures — type them from the label."
            : "Couldn't reach the food database. Type the values, or try again when you have signal.";
          macroEditing.scanOk = false;
          render();
        });
      });
      return;
    }

    const macroCancelBtn = e.target.closest("[data-macro-cancel]");
    if (macroCancelBtn) { macroEditing = null; render(); return; }
    const macroClearBtn = e.target.closest("[data-macro-clear]");
    if (macroClearBtn && currentId) {
      const idx = Number(macroClearBtn.getAttribute("data-macro-clear"));
      const st = getRecipeState(currentId);
      delete st.macros[idx];
      photoDel(photoKey(currentId, idx));
      macroEditing = null;
      saveState(); render(); return;
    }
    const macroSaveBtn = e.target.closest("[data-macro-save]");
    if (macroSaveBtn && currentId) {
      const idx = Number(macroSaveBtn.getAttribute("data-macro-save"));
      const num = cls => {
        const el = body.querySelector(cls);
        const v = el ? parseFloat(el.value) : NaN;
        return isNaN(v) || v < 0 ? null : v;
      };
      const kcal = num(".rb-m-kcal"), pp = num(".rb-m-p"), cc = num(".rb-m-c"), ff = num(".rb-m-f");
      const st = getRecipeState(currentId);
      if (kcal === null && pp === null && cc === null && ff === null) {
        delete st.macros[idx];
      } else {
        const key = getNutKey(r_byId(currentId).ingredients[idx]);
        const ref = key && NUT[key] ? NUT[key] : { kcal: 0, p: 0, c: 0, f: 0 };
        st.macros[idx] = {
          kcal: kcal === null ? ref.kcal : kcal,
          p: pp === null ? ref.p : pp,
          c: cc === null ? ref.c : cc,
          f: ff === null ? ref.f : ff
        };
      }
      if (macroEditing && macroEditing.photo) photoPut(photoKey(currentId, idx), macroEditing.photo);
      macroEditing = null;
      saveState(); render(); return;
    }

    const calcBtn = e.target.closest("[data-calc]");
    if (calcBtn && currentId) {
      calcFlash = currentId;
      breakdownOpen = currentId;
      render();
      setTimeout(() => { calcFlash = null; }, 1600);
      return;
    }
    const bdBtn = e.target.closest("[data-breakdown]");
    if (bdBtn && currentId) {
      breakdownOpen = breakdownOpen === currentId ? null : currentId;
      render(); return;
    }

    const cookedEditBtn = e.target.closest("[data-cooked-edit]");
    if (cookedEditBtn) { weighEditing = cookedEditBtn.getAttribute("data-cooked-edit"); render(); return; }
    const cookedCancelBtn = e.target.closest("[data-cooked-cancel]");
    if (cookedCancelBtn) { weighEditing = null; render(); return; }
    const cookedClearBtn = e.target.closest("[data-cooked-clear]");
    if (cookedClearBtn) {
      const st = getRecipeState(cookedClearBtn.getAttribute("data-cooked-clear"));
      delete st.cookedG;
      weighEditing = null;
      saveState(); render(); return;
    }
    const cookedSaveBtn = e.target.closest("[data-cooked-save]");
    if (cookedSaveBtn) {
      const rid = cookedSaveBtn.getAttribute("data-cooked-save");
      const st = getRecipeState(rid);
      const input = body.querySelector(".rb-cooked-input");
      const val = input ? parseFloat(input.value) : NaN;
      if (!isNaN(val) && val > 0) st.cookedG = val / st.servings;
      else delete st.cookedG;
      weighEditing = null;
      saveState(); render(); return;
    }

    const goalEditBtn = e.target.closest("[data-goal-edit]");
    if (goalEditBtn) { goalEditing = true; render(); return; }
    const goalCancelBtn = e.target.closest("[data-goal-cancel]");
    if (goalCancelBtn) { goalEditing = false; render(); return; }
    const goalSaveBtn = e.target.closest("[data-goal-save]");
    if (goalSaveBtn) {
      const kInput = body.querySelector(".rb-goal-kcal");
      const pInput = body.querySelector(".rb-goal-p");
      const goals = getGoals();
      const kv = kInput ? parseFloat(kInput.value) : NaN;
      const pv = pInput ? parseFloat(pInput.value) : NaN;
      goals.kcal = isNaN(kv) || kv < 0 ? 0 : Math.round(kv);
      goals.p = isNaN(pv) || pv < 0 ? 0 : Math.round(pv);
      goalEditing = false;
      saveState(); render(); return;
    }

    const incBtn = e.target.closest("[data-inc]");
    if (incBtn && currentId) {
      const st = getRecipeState(currentId);
      if (st.servings < 10) st.servings++;
      saveState(); render(); return;
    }
    const decBtn = e.target.closest("[data-dec]");
    if (decBtn && currentId) {
      const st = getRecipeState(currentId);
      if (st.servings > 1) st.servings--;
      saveState(); render(); return;
    }
    const resetBtn = e.target.closest("[data-reset]");
    if (resetBtn && !resetBtn.disabled && currentId) {
      const st = getRecipeState(currentId);
      st.checked = {};
      saveState(); render(); return;
    }
    const resetIngBtn = e.target.closest("[data-reset-ingredients]");
    if (resetIngBtn && !resetIngBtn.disabled && currentId) {
      const st = getRecipeState(currentId);
      st.overrides = {};
      st.custom.forEach(c => delete st.checked["custom_" + c.id]);
      st.custom = [];
      st.customSeq = 0;
      delete editingIng[currentId];
      saveState(); render(); return;
    }
    const addBtn = e.target.closest("[data-add-ing]");
    if (addBtn) { tryAddIngredient(); return; }

    const removeBtn = e.target.closest("[data-remove-custom]");
    if (removeBtn && currentId) {
      const cid = Number(removeBtn.getAttribute("data-remove-custom"));
      const st = getRecipeState(currentId);
      st.custom = st.custom.filter(c => c.id !== cid);
      delete st.checked["custom_" + cid];
      saveState(); render(); return;
    }

    const editIngBtn = e.target.closest("[data-edit-ing]");
    if (editIngBtn && currentId) {
      editingIng[currentId] = Number(editIngBtn.getAttribute("data-edit-ing"));
      render(); return;
    }
    const editSaveBtn = e.target.closest("[data-edit-save]");
    if (editSaveBtn && currentId) {
      const idx = Number(editSaveBtn.getAttribute("data-edit-save"));
      const input = body.querySelector(".rb-edit-amount-input");
      const val = input ? parseFloat(input.value) : NaN;
      if (!isNaN(val) && val >= 0) {
        const st = getRecipeState(currentId);
        st.overrides[idx] = { amount: val };
        delete editingIng[currentId];
        saveState(); render();
      }
      return;
    }
    const editRemoveBtn = e.target.closest("[data-edit-remove]");
    if (editRemoveBtn && currentId) {
      const idx = Number(editRemoveBtn.getAttribute("data-edit-remove"));
      const st = getRecipeState(currentId);
      st.overrides[idx] = { removed: true };
      delete editingIng[currentId];
      saveState(); render(); return;
    }
    const editCancelBtn = e.target.closest("[data-edit-cancel]");
    if (editCancelBtn && currentId) {
      delete editingIng[currentId];
      render(); return;
    }
    const restoreBtn = e.target.closest("[data-restore-ing]");
    if (restoreBtn && currentId) {
      const idx = Number(restoreBtn.getAttribute("data-restore-ing"));
      const st = getRecipeState(currentId);
      delete st.overrides[idx];
      saveState(); render(); return;
    }

    const chipBtn = e.target.closest("[data-side-chip]");
    if (chipBtn && currentId) {
      sidePicking[currentId] = chipBtn.getAttribute("data-side-chip");
      render(); return;
    }
    const portionBtn = e.target.closest("[data-side-portion]");
    if (portionBtn && currentId) {
      const type = sidePicking[currentId];
      const cfg = sideTypeByKey[type];
      if (cfg) commitSide(type, cfg.portion);
      return;
    }
    const manualAddBtn = e.target.closest("[data-side-manual-add]");
    if (manualAddBtn && currentId) {
      const input = body.querySelector(".rb-side-manual-input");
      const val = input ? parseFloat(input.value) : NaN;
      const type = sidePicking[currentId];
      if (type && !isNaN(val) && val > 0) commitSide(type, val);
      return;
    }
    const cancelBtn = e.target.closest("[data-side-cancel]");
    if (cancelBtn && currentId) { delete sidePicking[currentId]; render(); return; }

    const sideRemoveBtn = e.target.closest("[data-side-remove]");
    if (sideRemoveBtn && currentId) {
      const st = getRecipeState(currentId);
      st.side = null;
      delete st.checked["side"];
      saveState(); render(); return;
    }
  });

  root.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.classList.contains("rb-add-input")) {
      e.preventDefault(); tryAddIngredient();
    }
    if (e.key === "Enter" && e.target.classList.contains("rb-side-manual-input")) {
      e.preventDefault();
      const btn = body.querySelector("[data-side-manual-add]");
      if (btn) btn.click();
    }
    if (e.key === "Enter" && e.target.classList.contains("rb-edit-amount-input")) {
      e.preventDefault();
      const btn = body.querySelector("[data-edit-save]");
      if (btn) btn.click();
    }
    if (e.key === "Enter" && e.target.classList.contains("rb-log-grams")) {
      e.preventDefault();
      const btn = body.querySelector("[data-log-save]");
      if (btn) btn.click();
    }
  });

  root.addEventListener("change", (e) => {
    if (e.target.classList.contains("rb-photo-input")) {
      const file = e.target.files && e.target.files[0];
      if (!file || !macroEditing) return;
      shrinkImage(file, 1100, 0.68)
        .then(url => { if (macroEditing) { macroEditing.photo = url; render(); } })
        .catch(() => {});
      return;
    }
    if (e.target.classList.contains("rb-ing-check") && currentId) {
      const key = e.target.getAttribute("data-key");
      const st = getRecipeState(currentId);
      st.checked[key] = e.target.checked;
      saveState(); render(); return;
    }
    if (e.target.classList.contains("rb-switch-input")) {
      const key = e.target.getAttribute("data-pref");
      const prefs = getPrefs();
      prefs[key] = e.target.checked;
      saveState(); render(); return;
    }
  });

  loadState().then(() => {
    viewDate = todayKey();
    const hash = location.hash ? location.hash.slice(1) : "";
    if (hash && byId[hash]) {
      currentId = hash;
      view = "recipe";
      history.replaceState({ rb: "home" }, "", location.pathname + location.search);
      history.pushState({ rb: "recipe", id: hash }, "", "#" + hash);
    } else if (hash === "intake") {
      view = "intake";
      history.replaceState({ rb: "home" }, "", location.pathname + location.search);
      history.pushState({ rb: "intake" }, "", "#intake");
    } else {
      history.replaceState({ rb: "home" }, "", location.pathname + location.search);
    }
    render();
  });
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
