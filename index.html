<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blaze's Cook Book</title>
<meta name="description" content="Blaze's batch-cooking recipe book with live nutrition tracking.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#211c14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cook Book">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
  html, body {
    margin: 0; padding: 0;
    background: #211c14;
    min-height: 100vh;
  }

  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');

  #rb-root {
    --bg: #211c14;
    --surface: #2a2319;
    --surface-2: #332b1e;
    --line: rgba(241,233,216,0.14);
    --text: #f1e9d8;
    --muted: #a89a82;
    --mustard: #e3a008;
    --paprika: #d1531c;
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    border-radius: 14px;
    overflow: hidden;
    max-width: 460px;
    margin: 0 auto;
    min-height: 480px;
  }
  #rb-root * { box-sizing: border-box; }
  #rb-root button { font-family: inherit; cursor: pointer; }

  .rb-header { padding: 22px 20px 16px; border-bottom: 1px solid var(--line); }
  .rb-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 26px; letter-spacing: -0.01em; margin: 0; }
  .rb-subtitle { color: var(--muted); font-size: 13.5px; margin: 4px 0 0; }

  .rb-body { padding: 4px 20px 24px; }

  .rb-toggle-panel {
    background: var(--surface); border-radius: 12px; padding: 12px 14px;
    margin: 16px 0 6px; display: flex; flex-direction: column; gap: 12px;
  }
  .rb-toggle-panel.rb-toggle-panel-inline { margin: 6px 0 18px; }
  .rb-toggle-heading { font-size: 11.5px; color: var(--muted); margin: 0 0 -2px; }
  .rb-toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .rb-toggle-label { font-size: 13.5px; line-height: 1.3; }
  .rb-toggle-sub { display: block; font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .rb-switch-wrap { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
  .rb-switch-input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .rb-switch { position: absolute; inset: 0; border-radius: 12px; background: var(--line); pointer-events: none; transition: background .15s; }
  .rb-switch::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px;
    border-radius: 50%; background: var(--text); transition: transform .15s;
  }
  .rb-switch-input:checked + .rb-switch { background: var(--mustard); }
  .rb-switch-input:checked + .rb-switch::after { transform: translateX(18px); background: var(--bg); }

  .rb-cat-heading { font-family: 'Fraunces', serif; font-weight: 500; font-size: 16px; color: var(--mustard); margin: 22px 0 6px; }

  .rb-row {
    width: 100%; background: none; border: none; border-bottom: 1px solid var(--line);
    padding: 13px 2px; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; text-align: left; color: inherit;
  }
  .rb-row-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .rb-row-title { font-size: 15px; font-weight: 500; line-height: 1.3; }
  .rb-row-meta { font-size: 12.5px; color: var(--muted); }
  .rb-chevron { color: var(--muted); font-size: 18px; flex-shrink: 0; }
  .rb-row-check { font-size: 11px; color: var(--mustard); white-space: nowrap; }

  .rb-back { background: none; border: none; color: var(--muted); font-size: 14px; padding: 4px 0 2px; display: flex; align-items: center; gap: 4px; }
  .rb-back:active { color: var(--text); }

  .rb-recipe-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 22px; line-height: 1.25; margin: 10px 0 14px; }

  .rb-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .rb-stat { background: var(--surface); border-radius: 10px; padding: 9px 6px; text-align: center; }
  .rb-stat-num { font-size: 15px; font-weight: 600; color: var(--paprika); }
  .rb-stat-label { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .rb-stat-weight .rb-stat-num { color: #8fb3c9; }
  .rb-stat-kcal .rb-stat-num { color: var(--mustard); }
  .rb-stat-protein .rb-stat-num { color: #7fae62; }
  .rb-stat-carbs .rb-stat-num { color: var(--paprika); }
  .rb-stat-fat .rb-stat-num { color: #c9707a; }
  .rb-stat-cost .rb-stat-num { color: #6fa3a0; }
  .rb-per100 { font-size: 12px; color: var(--muted); text-align: center; margin: 8px 0 4px; }
  .rb-stats-grid-4 { grid-template-columns: repeat(4, 1fr); }
  .rb-stats-caption { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: center; margin: 0 0 8px; }
  .rb-ate-btn { display: block; width: 100%; margin: 12px 0 4px; padding: 12px; border: none; border-radius: 12px;
    background: var(--mustard); color: #211c14; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  .rb-log-hint { font-size: 12px; color: var(--muted); margin: 8px 0 2px; }
  .rb-weigh-line { font-size: 11.5px; color: var(--muted); text-align: center; margin: 2px 0 4px; }
  .rb-macro-btn { flex: none; background: none; border: none; font-size: 15px; line-height: 1; padding: 4px 6px;
    cursor: pointer; opacity: .45; filter: grayscale(1); }
  .rb-macro-btn.is-set { opacity: 1; filter: none; }
  .rb-macro-btn.src-everywhere { opacity: 1; filter: none; }
  .rb-macro-btn.src-recipe { opacity: 1; filter: none; }
  .rb-macro-btn.src-recipe::after, .rb-macro-btn.src-once::after { content: ""; display: block; height: 2px;
    border-radius: 2px; background: var(--mustard); margin-top: 1px; }
  .rb-macro-btn.src-once { opacity: 1; filter: none; }
  .rb-macro-btn.src-once::after { background: #8fb3c9; }
  .rb-scope { margin: 10px 0 4px; padding: 12px; border-radius: 10px; background: var(--bg); border: 1px solid rgba(201,160,74,.35); }
  .rb-scope-name { font-size: 14.5px; font-weight: 600; margin: 0 0 3px; }
  .rb-scope-macros { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
  .rb-scope-q { font-size: 12.5px; color: var(--muted); margin: 0 0 8px; }
  .rb-scope-btn { display: block; width: 100%; text-align: left; margin-bottom: 7px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: inherit;
    font-family: inherit; cursor: pointer; }
  .rb-scope-btn b { display: block; font-size: 14px; font-weight: 600; color: var(--mustard); margin-bottom: 2px; }
  .rb-scope-btn span { display: block; font-size: 11.5px; color: var(--muted); }
  .rb-body { padding-bottom: calc(92px + env(safe-area-inset-bottom)); }
  .rb-tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 50;
    width: 100%; max-width: 460px; display: flex; background: rgba(33,28,20,.96);
    border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .rb-tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 2px; border: none; background: none; color: var(--muted); font-size: 11px; font-weight: 500; }
  .rb-tabbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7;
    stroke-linecap: round; stroke-linejoin: round; }
  .rb-tabbar button.is-on { color: var(--mustard); }
  .rb-seg { display: flex; gap: 4px; background: var(--bg); padding: 3px; border-radius: 9px; margin: 8px 0 10px; }
  .rb-seg button { flex: 1; padding: 8px 4px; border: none; border-radius: 7px; background: none;
    color: var(--muted); font-size: 12.5px; font-weight: 500; }
  .rb-seg button.is-on { background: var(--surface-2); color: var(--mustard); }
  .rb-portion-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 14px; margin: 4px 0 2px; }
  .rb-portion-row input { width: 64px; padding: 9px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-family: inherit; font-size: 15px; text-align: center; }
  .rb-two-btns { display: flex; gap: 8px; }
  .rb-two-btns .rb-ate-btn { flex: 1; }
  .rb-ate-alt { background: var(--surface) !important; color: var(--mustard) !important; border: 1px solid rgba(227,160,8,.45) !important; }
  .rb-pp-select { margin-top: 8px; }
  .rb-scan-row { display: flex; gap: 8px; }
  .rb-scan-row .rb-scan-btn { flex: 1; margin-bottom: 4px; }
  .rb-gallery-btn { display: flex; align-items: center; justify-content: center; text-align: center;
    background: var(--surface-2) !important; color: var(--mustard) !important; border: 1px solid rgba(227,160,8,.45) !important; }
  .rb-gallery-input { display: none; }
  .rb-typecode { display: block; margin: 2px 0 6px; font-size: 12px; }
  .rb-stores { display: block; font-size: 11.5px; color: var(--mustard); margin-top: 3px; }
  .rb-off-add { display: block; margin: 2px 0 8px; font-size: 12px; }
  .rb-data-note { font-size: 11px; color: var(--muted); opacity: .8; margin: 14px 0 0; line-height: 1.45; }
  .rb-pp-card { margin: 10px 0 2px; padding: 10px 12px; border-radius: 9px; background: var(--bg);
    border: 1px solid rgba(227,160,8,.4); }
  .rb-pp-card b { display: block; font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .rb-pp-card span { display: block; font-size: 12px; color: var(--muted); }
  .rb-pp-manual { margin-top: 10px; }
  .rb-pp-manual .rb-add-input { width: 100%; }
  .rb-pp-typelink { display: block; margin: 10px 0 2px; font-size: 12.5px; }
  .rb-b-field { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .rb-b-field .rb-add-input { width: 100%; font-size: 16px; }
  .rb-b-row { display: flex; align-items: center; gap: 8px; padding: 9px 2px; border-bottom: 1px solid var(--line); }
  .rb-b-main { flex: 1; min-width: 0; }
  .rb-b-name { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rb-b-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .rb-b-g { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
  .rb-b-g input { width: 66px; padding: 7px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-family: inherit; font-size: 14px; text-align: right; }
  .rb-b-total { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0 4px; text-align: center; }
  .rb-b-total div { background: var(--surface); border-radius: 9px; padding: 8px 4px; font-size: 11px; color: var(--muted); }
  .rb-b-total b { display: block; font-size: 16px; color: var(--text); }
  .rb-b-save:disabled { opacity: .45; cursor: default; }
  .rb-b-discard { display: block; margin: 6px auto 0; }
  .rb-optional { font-style: normal; font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 6px; }
  .rb-macro-btn.src-fixed { opacity: 1; filter: none; }
  .rb-tabs { display: flex; gap: 6px; margin-bottom: 14px; background: var(--surface); padding: 4px; border-radius: 11px; }
  .rb-tab { flex: 1; padding: 9px 6px; border: none; border-radius: 8px; background: none; color: var(--muted);
    font-family: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer; }
  .rb-tab i { font-style: normal; opacity: .7; font-size: 11.5px; }
  .rb-tab.is-on { background: var(--bg); color: var(--mustard); }
  .rb-need-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 11px 2px; border: none; border-bottom: 1px solid var(--line); background: none;
    color: inherit; font-family: inherit; cursor: pointer; }
  .rb-need-main { flex: 1; min-width: 0; }
  .rb-need-name { display: block; font-size: 14.5px; margin-bottom: 2px; }
  .rb-need-meta { display: block; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rb-need-state { flex: none; font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase;
    color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; }
  .rb-need-state.is-on { color: var(--mustard); border-color: rgba(201,160,74,.45); }
  .rb-pan-row { display: flex; gap: 10px; align-items: flex-start; padding: 12px 2px; border-bottom: 1px solid var(--line); }
  .rb-pan-main { flex: 1; min-width: 0; }
  .rb-pan-name { font-size: 14.5px; font-weight: 500; margin-bottom: 3px; }
  .rb-pan-macros { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .rb-pan-use { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 5px;
    background: var(--surface); color: var(--muted); }
  .rb-pan-use.is-every { color: var(--mustard); border: 1px solid rgba(201,160,74,.4); }
  .rb-pan-use.is-idle { opacity: .6; }
  .rb-pan-code { font-size: 10.5px; color: var(--muted); opacity: .6; margin-top: 5px; font-variant-numeric: tabular-nums; }
  .rb-scan-btn { display: block; width: 100%; margin: 10px 0 6px; padding: 12px; border: none; border-radius: 10px;
    background: var(--mustard); color: #211c14; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  .rb-scan-result { font-size: 12.5px; margin: 6px 0; padding: 8px 10px; border-radius: 8px; background: var(--bg); }
  .rb-scan-result.is-ok { color: var(--mustard); }
  .rb-scan-result.is-bad { color: #d79aa2; }
  .rb-scan { position: fixed; inset: 0; z-index: 90; background: #000; display: flex;
    flex-direction: column; align-items: center; justify-content: center; }
  .rb-scan-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .rb-scan-frame { position: relative; width: 74%; max-width: 330px; aspect-ratio: 3 / 2;
    border: 2px solid rgba(255,255,255,.9); border-radius: 14px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.55); }
  .rb-scan-msg { position: relative; color: #fff; font-size: 14px; text-align: center; margin: 20px 24px 0; }
  .rb-scan-actions { position: relative; display: flex; flex-direction: column; gap: 8px; margin-top: 18px; width: 74%; max-width: 330px; }
  .rb-scan-actions button { background: rgba(255,255,255,.14); color: #fff; }
  .rb-photo-btn { display: block; text-align: center; margin: 10px 0; padding: 11px; border-radius: 10px;
    border: 1px dashed rgba(201,160,74,.5); color: var(--mustard); font-size: 14px; cursor: pointer; }
  .rb-photo-input { display: none; }
  .rb-label-shot { display: block; width: 100%; max-height: 240px; object-fit: contain;
    border-radius: 10px; margin: 8px 0; background: #000; }
  .rb-macro-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 10px 0 2px; }
  .rb-macro-grid label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); }
  .rb-macro-grid input { padding: 9px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-family: inherit; font-size: 14px; width: 100%; }
  .rb-calc-btn { display: block; width: 100%; margin: 16px 0 4px; padding: 12px; border: none; border-radius: 12px;
    background: var(--surface); color: var(--mustard); border: 1px solid rgba(201,160,74,.45);
    font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  .rb-breakdown { margin: 12px 0 4px; padding: 12px; background: var(--surface); border-radius: 12px; }
  .rb-bd-head, .rb-bd-row { display: grid; grid-template-columns: 1fr 44px 50px 46px; gap: 6px; align-items: baseline; }
  .rb-bd-head { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
    padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .rb-bd-head span:not(:first-child), .rb-bd-row span:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
  .rb-bd-row { font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .rb-bd-row.is-unknown { opacity: .5; }
  .rb-bd-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rb-bd-tag { font-style: normal; font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase;
    color: var(--mustard); border: 1px solid rgba(201,160,74,.45); border-radius: 4px; padding: 1px 4px; margin-left: 4px; }
  .rb-bd-total { font-weight: 600; border-bottom: none; padding-top: 8px; }
  .rb-linkbtn { background: none; border: none; padding: 0; font-family: inherit; font-size: inherit;
    color: var(--mustard); text-decoration: underline; cursor: pointer; }
  .rb-intake-card { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; margin-bottom: 18px;
    padding: 14px; border: 1px solid rgba(201,160,74,.35); border-radius: 12px; background: var(--surface);
    color: inherit; font-family: inherit; cursor: pointer; }
  .rb-intake-main { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .rb-intake-title { font-size: 15px; font-weight: 600; color: var(--mustard); }
  .rb-intake-meta { font-size: 12.5px; color: var(--muted); }
  .rb-day-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .rb-day-nav button { width: 38px; height: 34px; border: none; border-radius: 9px; background: var(--surface);
    color: var(--text); font-size: 18px; cursor: pointer; }
  .rb-day-nav button:disabled { opacity: .3; cursor: default; }
  .rb-day-label { font-size: 15px; font-weight: 600; }
  .rb-goal { margin: 12px 0; }
  .rb-goal-head { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
  .rb-goal-track { height: 7px; border-radius: 4px; background: var(--surface); overflow: hidden; }
  .rb-goal-fill { height: 100%; background: var(--mustard); border-radius: 4px; }
  .rb-log-row { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .rb-log-main { flex: 1; }
  .rb-log-name { font-size: 14.5px; margin-bottom: 2px; }
  .rb-log-meta { font-size: 12px; color: var(--muted); }
  .rb-empty { font-size: 13.5px; color: var(--muted); padding: 10px 0; }
  .rb-log-recipe { width: 100%; padding: 10px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-family: inherit; font-size: 14px; }
  .rb-side-line { font-size: 12px; color: var(--muted); text-align: center; margin: 0 0 4px; line-height: 1.5; }
  .rb-combined-line { font-size: 12.5px; color: var(--mustard); text-align: center; margin: 4px 0 18px; line-height: 1.5; font-weight: 500; }

  .rb-servings-row { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border-radius: 12px; padding: 10px 14px; margin-bottom: 18px; }
  .rb-servings-label { font-size: 14px; font-weight: 500; }
  .rb-stepper { display: flex; align-items: center; gap: 14px; }
  .rb-stepper button {
    width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--mustard);
    background: none; color: var(--mustard); font-size: 17px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .rb-stepper button:disabled { opacity: 0.3; }
  .rb-stepper button:active:not(:disabled) { background: var(--mustard); color: var(--bg); }
  .rb-stepper-val { font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 600; min-width: 16px; text-align: center; }

  .rb-section-label { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 500; color: var(--mustard); margin: 0 0 4px; }
  .rb-ing-progress { font-size: 12px; color: var(--muted); margin-bottom: 8px; }

  .rb-ing-row { display: flex; align-items: center; gap: 11px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .rb-ing-check { position: absolute; opacity: 0; width: 20px; height: 20px; }
  .rb-box { width: 19px; height: 19px; border: 1.5px solid var(--muted); border-radius: 5px; flex-shrink: 0; position: relative; }
  .rb-ing-check:checked + .rb-box { background: var(--mustard); border-color: var(--mustard); }
  .rb-ing-check:checked + .rb-box::after {
    content: ''; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px;
    border: solid var(--bg); border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .rb-ing-text { font-size: 14.5px; line-height: 1.35; flex: 1; }
  .rb-ing-check:checked ~ .rb-ing-text { color: var(--muted); text-decoration: line-through; }

  function resolveMacro(recipeId, ing, idx, st) {

  const byId = {};

  let currentId = null;
  let view = "home";      // "home" | "recipe" | "intake"
  let viewDate = "";      // YYYY-MM-DD currently shown in the intake view
  let logPicking = null;  // recipeId whose "how many grams did I eat" panel is open
  let goalEditing = false;
  let weighEditing = null; // recipeId whose cooked-weight panel is open
  let macroEditing = null;  // {id, idx, photo} — ingredient whose packet-macros panel is open
  let breakdownOpen = null; // recipeId whose macro breakdown is expanded
  let logDishSel = null;     // intake: dish chosen in the "add a dish" picker
  let pantryTab = "needed";  // which of the two product lists is showing
  let pantryEditing = null;  // {key, label, product, scanned, scanMsg, scanOk}
  let builderAdding = false; // recipe builder: add-ingredient panel open
  let pantryAdding = false;  // pantry: add-product panel open
  const tempMacros = {};    // "recipeId:idx" -> product, for a single cook only (never saved)
  let calcFlash = null;     // recipeId briefly confirming a recalculation
  const sidePicking = {}; // transient UI state: recipeId -> side type key currently being configured
  const editingIng = {}; // transient UI state: recipeId -> ingredient idx currently being edited
  const root = document.getElementById("rb-root");
  const body = document.getElementById("rb-body");
  const headerTitle = document.getElementById("rb-header-title");
  const headerSub = document.getElementById("rb-header-sub");

  function getPrefs() {
    if (!state.prefs) state.prefs = { weight: true, powder: true, tomatoPuree: false };
    return state.prefs;
  }

  async function loadState() {
    try {
      const raw = localStorage.getItem("blaze-cookbook-state");
      state = raw ? JSON.parse(raw) : {};
    } catch (e) { state = {}; }
    getPrefs();
    syncMyRecipes();
  }
  function saveState() {
    try { localStorage.setItem("blaze-cookbook-state", JSON.stringify(state)); } catch (e) {}
  }
  // ---- barcode scanning + Open Food Facts -------------------------------
  // Packaged food carries its own identifier, so reading the barcode beats
  // reading the label: exact figures, no OCR guesswork. Looked-up products are
  // cached locally, so a repeat scan of the same tin works with no signal.
  const OFF_URL = "https://world.openfoodfacts.org/api/v2/product/";

  // The pantry: every product ever scanned, kept on this phone. Keyed by
  // barcode, because that is the one identifier a tin actually carries.
  function getPantry() {
    if (!state._pantry) {
      state._pantry = {};
      // carry over anything saved by the earlier flat barcode cache
      if (state._barcodes) {
        Object.keys(state._barcodes).forEach(code => { state._pantry[code] = state._barcodes[code]; });
        delete state._barcodes;
      }
    }
    return state._pantry;
  }
  // Which pantry product stands in for an ingredient everywhere it appears:
  // ingredient key -> barcode.
  function getDefaults() {
    if (!state._defaults) state._defaults = {};
    return state._defaults;
  }
  // Identity of an ingredient across recipes. The nutrition key is the right
  // grain — "kidney beans" is the same thing in every pot — with the name as a
  // fallback for ingredients the table does not know.
  function ingredientKey(ing) {
    return getNutKey(ing) || ("name:" + String(ing.n || "").toLowerCase().replace(/[^a-z]+/g, " ").trim());
  }
  function ingLabelFor(r, idx) {
    const ing = r.ingredients[idx];
    const key = getNutKey(ing);
    return key ? key.replace(/_/g, " ") : (ing.n || "this ingredient");
  }
  function macrosOf(prod) {
    return prod ? { kcal: prod.kcal, p: prod.p, c: prod.c, f: prod.f } : null;
  }

  function nutrimentsToMacros(n) {
    if (!n) return null;
    const num = v => (typeof v === "number" && isFinite(v) && v >= 0) ? v : null;
    let kcal = num(n["energy-kcal_100g"]);
    if (kcal === null) {
      const kj = num(n["energy_100g"]) ?? num(n["energy-kj_100g"]);
      if (kj !== null) kcal = kj / 4.184;
    }
    const pr = num(n["proteins_100g"]);
    const cb = num(n["carbohydrates_100g"]);
    const ft = num(n["fat_100g"]);
    if (kcal === null && pr === null && cb === null && ft === null) return null;
    return {
      kcal: kcal === null ? 0 : Math.round(kcal * 10) / 10,
      p: pr === null ? 0 : Math.round(pr * 10) / 10,
      c: cb === null ? 0 : Math.round(cb * 10) / 10,
      f: ft === null ? 0 : Math.round(ft * 10) / 10
    };
  }

  // ---- built-in European product database --------------------------------
  // A weekly snapshot of every European product in Open Food Facts that has
  // nutrition figures, built on GitHub and published next to the app as small
  // shards keyed by barcode prefix. A lookup fetches the index once and then
  // only the one shard it needs; the service worker keeps both for offline use.
  const SNAP_BASE = "data/off/";
  let snapIndexP = null, snapInfo = null;
  function snapshotIndex() {
    if (!snapIndexP) {
      snapIndexP = fetch(SNAP_BASE + "index.json")
        .then(r => r.ok ? r.json() : null)
        .catch(() => null)
        .then(j => {
          if (!j || !Array.isArray(j.shards)) { snapIndexP = null; return null; }
          j._set = new Set(j.shards);
          snapInfo = j;
          return j;
        });
    }
    return snapIndexP;
  }
  const shardP = {};
  function codeVariants(code) {
    const v = [code];
    if (/^\d{12}$/.test(code)) v.push("0" + code);       // UPC-A read as EAN-13
    if (/^0\d{12}$/.test(code)) v.push(code.slice(1));
    return v;
  }
  async function snapshotLookup(code) {
    const idx = await snapshotIndex();
    if (!idx) return null;
    for (const c of codeVariants(code)) {
      let prefix = null;
      for (let L = Math.min(c.length, 11); L >= 3; L--) {
        if (idx._set.has(c.slice(0, L))) { prefix = c.slice(0, L); break; }
      }
      if (!prefix) continue;
      if (!shardP[prefix]) {
        shardP[prefix] = fetch(SNAP_BASE + prefix + ".json")
          .then(r => r.ok ? r.json() : null)
          .catch(() => null)
          .then(j => { if (!j) delete shardP[prefix]; return j || {}; });
      }
      const rec = (await shardP[prefix])[c];
      if (rec) return { code: code, name: rec[0], kcal: rec[1], p: rec[2], c: rec[3], f: rec[4], stores: rec[5] || "" };
    }
    return null;
  }
  function pantryRecord(prod) {
    const r = { code: prod.code, name: prod.name, kcal: prod.kcal, p: prod.p, c: prod.c, f: prod.f };
    if (prod.stores) r.stores = prod.stores;
    return r;
  }
  function storesLine(prod) {
    return prod && prod.stores ? `<span class="rb-stores">Sold at ${escHtml(prod.stores)}</span>` : "";
  }
  function offAddLink(code) {
    return /^\d{8,14}$/.test(String(code || "")) ? `<a class="rb-linkbtn rb-off-add" href="https://world.openfoodfacts.org/product/${code}" target="_blank" rel="noopener">Add it to Open Food Facts, so it's found next time — for everyone</a>` : "";
  }

  async function lookupBarcode(code) {
    const mine = getPantry()[code];
    if (mine) return mine;
    if (!state._offCache) state._offCache = {};
    const cache = state._offCache;
    if (cache[code]) return cache[code];
    const snap = await snapshotLookup(code);
    if (snap) { cache[code] = snap; saveState(); return snap; }
    let res;
    try {
      res = await fetch(OFF_URL + encodeURIComponent(code) + ".json?fields=product_name,brands,nutriments,stores",
        { headers: { "Accept": "application/json" } });
    } catch (e) {
      throw new Error("offline");
    }
    if (res.status === 404) throw new Error("notfound");
    if (!res.ok) throw new Error("offline");
    const j = await res.json();
    const prod = j && j.product;
    if (!prod || (j.status !== undefined && j.status !== 1 && !prod.nutriments)) throw new Error("notfound");
    const macros = nutrimentsToMacros(prod.nutriments);
    if (!macros) throw new Error("nonutrition");
    const name = [prod.brands, prod.product_name].filter(Boolean).join(" — ") || ("Barcode " + code);
    const entry = Object.assign({ name: name, code: code }, macros);
    if (prod.stores) entry.stores = String(prod.stores).split(",").map(x => x.trim()).filter(Boolean).slice(0, 4).join(", ");
    cache[code] = entry;
    saveState();
    return entry;
  }

  const BARCODE_FORMATS = ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39"];

  // Read a barcode out of a saved photo. Gallery shots are often huge or taken
  // sideways, so a smaller copy and a quarter turn are tried before giving up.
  async function decodeBarcodeFromFile(file) {
    if (!barcodeSupported()) throw new Error("unsupported");
    const detector = new window.BarcodeDetector({ formats: BARCODE_FORMATS });
    let bmp;
    try { bmp = await createImageBitmap(file); } catch (e) { throw new Error("badimage"); }
    const sources = [bmp];
    const big = Math.max(bmp.width, bmp.height);
    for (const target of [1600, 900]) {
      if (big > target) {
        const k = target / big;
        try {
          sources.push(await createImageBitmap(bmp, {
            resizeWidth: Math.round(bmp.width * k), resizeHeight: Math.round(bmp.height * k), resizeQuality: "high" }));
        } catch (e) {}
      }
    }
    const turned = src => {
      const cv = document.createElement("canvas");
      cv.width = src.height; cv.height = src.width;
      const g = cv.getContext("2d");
      g.translate(cv.width / 2, cv.height / 2); g.rotate(Math.PI / 2);
      g.drawImage(src, -src.width / 2, -src.height / 2);
      return cv;
    };
    for (const src of sources) {
      for (const img of [src, turned(src)]) {
        let codes = [];
        try { codes = await detector.detect(img); } catch (e) {}
        if (codes && codes.length && codes[0].rawValue) return codes[0].rawValue;
      }
    }
    throw new Error("nocode");
  }
  function galleryErrorText(err) {
    const why = err && err.message;
    if (why === "unsupported") return "This browser can't read barcodes from pictures \u2014 type the number printed under the bars instead.";
    if (why === "badimage") return "Couldn't open that picture. Try another one.";
    return "No barcode found in that picture. A sharper, closer photo of the bars works best \u2014 or type the number printed under them.";
  }
  function galleryInput(attr, val) {
    return `<label class="rb-scan-btn rb-gallery-btn">\uD83D\uDDBC &nbsp;From gallery
        <input type="file" accept="image/*" class="rb-gallery-input" ${attr}="${val}"></label>`;
  }
  function scanRow(scanAttr, scanVal, galAttr, galVal, typeAttr, typeVal) {
    return `<div class="rb-scan-row">
        <button class="rb-scan-btn" ${scanAttr}="${scanVal}" type="button">\u25A5 &nbsp;Scan</button>
        ${galleryInput(galAttr, galVal)}
      </div>
      <button class="rb-linkbtn rb-typecode" ${typeAttr}="${typeVal}" type="button">Type the barcode number instead</button>`;
  }
  function askBarcodeNumber() {
    const v = prompt("Barcode number (the digits under the bars):");
    return v && v.replace(/\s/g, "") ? v.replace(/\s/g, "") : null;
  }

  function barcodeSupported() {
    return typeof window.BarcodeDetector === "function";
  }

  // Full-screen scanner overlay. It lives outside the re-rendered body so a
  // render() mid-scan cannot tear the camera down.
  function openScanner(onCode) {
    const wrap = document.createElement("div");
    wrap.className = "rb-scan";
    wrap.innerHTML =
      '<video class="rb-scan-video" playsinline muted></video>' +
      '<div class="rb-scan-frame"></div>' +
      '<p class="rb-scan-msg">Point the camera at the barcode</p>' +
      '<div class="rb-scan-actions">' +
        '<button class="rb-side-cancel rb-scan-type" type="button">Type the number instead</button>' +
        '<button class="rb-side-cancel rb-scan-close" type="button">Cancel</button>' +
      '</div>';
    document.body.appendChild(wrap);

    const video = wrap.querySelector(".rb-scan-video");
    const msg = wrap.querySelector(".rb-scan-msg");
    let stream = null, raf = 0, done = false;

    function close() {
      if (done) return;
      done = true;
      if (raf) cancelAnimationFrame(raf);
      if (stream) stream.getTracks().forEach(t => t.stop());
      wrap.remove();
    }
    function finish(code) {
      if (done) return;
      close();
      onCode(code);
    }

    wrap.querySelector(".rb-scan-close").addEventListener("click", close);
    wrap.querySelector(".rb-scan-type").addEventListener("click", () => {
      const typed = prompt("Barcode number (the digits under the bars):");
      if (typed && typed.trim()) finish(typed.trim().replace(/\s/g, ""));
      else close();
    });

    if (!barcodeSupported()) {
      msg.textContent = "This browser cannot scan barcodes — type the number instead.";
      return;
    }

    const detector = new window.BarcodeDetector({ formats: BARCODE_FORMATS });

    // The detect loop must not be gated on play() resolving: under autoplay
    // policies that promise can reject or never settle, which would leave the
    // scanner showing a live picture while silently detecting nothing.
    function startDetecting() {
      if (done || raf) return;
      const started = Date.now();
      const tick = () => {
        if (done) return;
        if (Date.now() - started > 25000) {
          msg.textContent = "Still no barcode — try better light, or type the number.";
        }
        detector.detect(video)
          .then(codes => {
            if (done) return;
            if (codes && codes.length && codes[0].rawValue) finish(codes[0].rawValue);
            else raf = requestAnimationFrame(tick);
          })
          .catch(() => { if (!done) raf = requestAnimationFrame(tick); });
      };
      raf = requestAnimationFrame(tick);
    }

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(st => {
        if (done) { st.getTracks().forEach(t => t.stop()); return; }
        stream = st;
        video.srcObject = st;
        video.addEventListener("loadedmetadata", startDetecting, { once: true });
        const p = video.play();
        if (p && p.catch) p.catch(() => {});
        startDetecting();
      })
      .catch(() => {
        if (done) return;
        msg.textContent = "No camera access — type the number instead.";
      });
  }

  // ---- shared helpers ---------------------------------------------------
  // Product names come from a community database, so never trust them as HTML.
  function escHtml(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, ch =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
  }
  function slug(v) { return String(v || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "item"; }
  function generalLabel(key) {
    return key.replace(/_dry$/, " (dry)").replace(/_cooked$/, " (cooked)").replace(/_canned$/, " (canned)")
      .replace(/_baked$/, " (baked)").replace(/_/g, " ");
  }
  // per-100g of a general-table ingredient, honouring an everywhere-default product
  function generalMacros(key) {
    const code = getDefaults()[key];
    const prod = code ? getPantry()[code] : null;
    if (prod) return macrosOf(prod);
    const n = NUT[key];
    return n ? { kcal: n.kcal, p: n.p, c: n.c, f: n.f } : { kcal: 0, p: 0, c: 0, f: 0 };
  }
  function macroLine(m) {
    return `${fmt1(m.kcal)} kcal &nbsp;·&nbsp; ${fmt1(m.p)}g P &nbsp;·&nbsp; ${fmt1(m.c)}g C &nbsp;·&nbsp; ${fmt1(m.f)}g F`;
  }

  // ---- product picker -----------------------------------------------------
  // One scan-or-pick-or-type component, reused by the pantry, the intake log
  // and the recipe builder. Each use gets its own context name.
  const pickers = {};
  function picker(ctx) {
    if (!pickers[ctx]) pickers[ctx] = { product: null, msg: null, ok: true, manual: false, lastCode: null };
    return pickers[ctx];
  }
  function resetPicker(ctx) { delete pickers[ctx]; }
  function pickerHtml(ctx, opts) {
    const pk = picker(ctx);
    const pantry = getPantry();
    const codes = Object.keys(pantry);
    let sel = "";
    if (opts.select && (codes.length || opts.general)) {
      const cur = pk.product && !pk.manual ? (pk.product.nutKey ? "g:" + pk.product.nutKey : "p:" + pk.product.code) : "";
      sel = `<select class="rb-log-recipe rb-pp-select" data-pp-select="${ctx}">
          <option value="">${opts.general ? "…or pick from your pantry or the general list" : "…or pick from your pantry"}</option>
          ${codes.length ? `<optgroup label="My pantry">${codes.map(c =>
            `<option value="p:${escHtml(c)}" ${cur === "p:" + c ? "selected" : ""}>${escHtml(pantry[c].name)}</option>`).join("")}</optgroup>` : ""}
          ${opts.general ? `<optgroup label="General ingredients">${Object.keys(NUT).sort().map(k =>
            `<option value="g:${k}" ${cur === "g:" + k ? "selected" : ""}>${generalLabel(k)}</option>`).join("")}</optgroup>` : ""}
        </select>`;
    }
    const msg = pk.msg ? `<p class="rb-scan-result ${pk.ok ? "is-ok" : "is-bad"}">${escHtml(pk.msg)}</p>${pk.missing ? offAddLink(pk.lastCode) : ""}` : "";
    const card = pk.product && !pk.manual ? `
        <div class="rb-pp-card">
          <b>${escHtml(pk.product.name)}</b>
          <span>${macroLine(pk.product)} &nbsp;<i>per 100g</i></span>
          ${storesLine(pk.product)}
        </div>` : "";
    const manual = pk.manual ? `
        <div class="rb-pp-manual">
          <input type="text" class="rb-add-input rb-pp-name" placeholder="Product name">
          <div class="rb-macro-grid">
            <label><span>kcal</span><input type="number" min="0" step="any" class="rb-pp-kcal"></label>
            <label><span>protein</span><input type="number" min="0" step="any" class="rb-pp-p"></label>
            <label><span>carbs</span><input type="number" min="0" step="any" class="rb-pp-c"></label>
            <label><span>fat</span><input type="number" min="0" step="any" class="rb-pp-f"></label>
          </div>
          <p class="rb-log-hint">Per 100 g, as printed on the label.${pk.lastCode ? " Saved under barcode " + escHtml(pk.lastCode) + ", so the next scan finds it." : ""}</p>
        </div>`
      : `<button class="rb-linkbtn rb-pp-typelink" data-pp-manual="${ctx}" type="button">Not listed? Type it in yourself</button>`;
    return `${scanRow("data-pp-scan", ctx, "data-pp-gallery", ctx, "data-pp-typecode", ctx)}${msg}${sel}${card}${manual}`;
  }
  // The chosen product, or null. Typed entries become pantry-ready products.
  function pickerResult(ctx) {
    const pk = picker(ctx);
    if (!pk.manual) return pk.product;
    const val = cls => { const el = body.querySelector(cls); const v = el ? parseFloat(el.value) : NaN; return isNaN(v) || v < 0 ? 0 : v; };
    const nameEl = body.querySelector(".rb-pp-name");
    const name = nameEl ? nameEl.value.trim() : "";
    if (!name) return null;
    return {
      code: pk.lastCode || ("manual:" + slug(name)), name: name,
      kcal: val(".rb-pp-kcal"), p: val(".rb-pp-p"), c: val(".rb-pp-c"), f: val(".rb-pp-f")
    };
  }
  function pickerHandleCode(ctx, code) {
    const pk = picker(ctx);
    pk.msg = "Looking up " + code + "\u2026"; pk.ok = true; pk.product = null; pk.manual = false; pk.missing = false;
    render();
    lookupBarcode(code).then(entry => {
      if (pickers[ctx] !== pk) return;
      pk.product = entry; pk.msg = null; pk.lastCode = code;
      render();
    }).catch(err => {
      if (pickers[ctx] !== pk) return;
      const why = err && err.message;
      pk.msg = why === "notfound" ? "Barcode " + code + " isn't in the food database \u2014 type the label values below."
        : why === "nonutrition" ? "That product is listed without nutrition figures \u2014 type them below."
        : "Couldn't reach the food database. Type the values below, or scan again when you have signal.";
      pk.ok = false; pk.manual = true; pk.lastCode = code; pk.missing = why === "notfound" || why === "nonutrition";
      render();
    });
  }
  function pickerScan(ctx) {
    const pk = picker(ctx);
    openScanner(code => { if (pickers[ctx] === pk) pickerHandleCode(ctx, code); });
  }
  function pickerGallery(ctx, file) {
    const pk = picker(ctx);
    pk.msg = "Reading the barcode from your picture\u2026"; pk.ok = true;
    render();
    decodeBarcodeFromFile(file)
      .then(code => { if (pickers[ctx] === pk) pickerHandleCode(ctx, code); })
      .catch(err => { if (pickers[ctx] !== pk) return; pk.msg = galleryErrorText(err); pk.ok = false; render(); });
  }
  function pickerSelect(ctx, value) {
    const pk = picker(ctx);
    pk.manual = false; pk.msg = null;
    if (!value) { pk.product = null; return; }
    if (value.indexOf("p:") === 0) { pk.product = getPantry()[value.slice(2)] || null; return; }
    if (value.indexOf("g:") === 0) {
      const key = value.slice(2);
      pk.product = Object.assign({ code: "general:" + key, name: generalLabel(key), nutKey: key }, generalMacros(key));
    }
  }

  // ---- your own recipes -------------------------------------------------
  // Stored as plain gram lists, then turned into ordinary book recipes so the
  // servings scaler, checklist, logging and breakdown all work on them too.
  function myRecipes() {
    if (!state._myRecipes) state._myRecipes = [];
    return state._myRecipes;
  }
  function toRecipe(m) {
    return {
      id: m.id, cat: "My Recipes", title: m.title, price: null, sidesEligible: true, mine: true,
      ingredients: m.items.map(it => {
        const ing = { a: it.g, u: "g", n: it.name };
        if (it.nutKey) ing.nutKey = it.nutKey;
        else { ing.code = it.code || null; ing.fixed = { kcal: it.kcal, p: it.p, c: it.c, f: it.f }; }
        return ing;
      }),
      steps: (m.steps || []).slice()
    };
  }
  function syncMyRecipes() {
    for (let i = recipes.length - 1; i >= 0; i--) {
      if (recipes[i].mine) { delete byId[recipes[i].id]; recipes.splice(i, 1); }
    }
    myRecipes().slice().reverse().forEach(m => { const r = toRecipe(m); recipes.unshift(r); byId[r.id] = r; });
  }
  function getDraft() {
    if (!state._draft) state._draft = { editId: null, title: "", items: [], steps: [] };
    return state._draft;
  }
  // live per-100g for a builder line (general items follow the table and defaults)
  function itemMacros(it) {
    if (it.nutKey) return generalMacros(it.nutKey);
    const own = it.code ? getPantry()[it.code] : null;
    return own ? macrosOf(own) : { kcal: it.kcal, p: it.p, c: it.c, f: it.f };
  }


  // ---- label photos -----------------------------------------------------
  // Photos live in IndexedDB, not localStorage: a handful of label shots would
  // blow the ~5MB string quota that holds all the rest of the app state.
  const PHOTO_DB = "blaze-cookbook-photos";
  let photoDbPromise = null;
  function photoDb() {
    if (photoDbPromise) return photoDbPromise;
    photoDbPromise = new Promise((resolve, reject) => {
      let req;
      try { req = indexedDB.open(PHOTO_DB, 1); } catch (e) { reject(e); return; }
      req.onupgradeneeded = () => {
        if (!req.result.objectStoreNames.contains("photos")) req.result.createObjectStore("photos");
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    }).catch(() => null);
    return photoDbPromise;
  }
  async function photoPut(key, dataUrl) {
    const db = await photoDb();
    if (!db) return false;
    return new Promise(res => {
      try {
        const tx = db.transaction("photos", "readwrite");
        tx.objectStore("photos").put(dataUrl, key);
        tx.oncomplete = () => res(true);
        tx.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  }
  async function photoGet(key) {
    const db = await photoDb();
    if (!db) return null;
    return new Promise(res => {
      try {
        const tx = db.transaction("photos", "readonly");
        const rq = tx.objectStore("photos").get(key);
        rq.onsuccess = () => res(rq.result || null);
        rq.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  }
  async function photoDel(key) {
    const db = await photoDb();
    if (!db) return;
    try {
      const tx = db.transaction("photos", "readwrite");
      tx.objectStore("photos").delete(key);
    } catch (e) {}
  }
  // shrink before storing — a phone camera shot is several MB and a label only
  // needs to stay readable
  function shrinkImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onerror = () => reject(new Error("read failed"));
      fr.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error("decode failed"));
        img.onload = () => {
          let { width: w, height: h } = img;
          const scale = Math.min(1, maxDim / Math.max(w, h));
          w = Math.round(w * scale); h = Math.round(h * scale);
          const cv = document.createElement("canvas");
          cv.width = w; cv.height = h;
          cv.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(cv.toDataURL("image/jpeg", quality));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  function photoKey(recipeId, idx) { return recipeId + ":" + idx; }

  // ---- daily intake log -------------------------------------------------
  // state._intake = { "YYYY-MM-DD": [ {id, name, g, kcal, p, c, f} ] }
  // state._goals  = { kcal, p }   (0 / missing = no goal set)
  function todayKey(d) {
    const dt = d || new Date();
    return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");
  }
  function getIntake() {
    if (!state._intake) state._intake = {};
    return state._intake;
  }
  function getDayLog(key) {
    const all = getIntake();
    if (!all[key]) all[key] = [];
    return all[key];
  }
  function getGoals() {
    if (!state._goals) state._goals = { kcal: 0, p: 0 };
    return state._goals;
  }
  function dayTotals(key) {
    const t = { kcal: 0, p: 0, c: 0, f: 0, g: 0 };
    getDayLog(key).forEach(e => {
      t.kcal += e.kcal; t.p += e.p; t.c += e.c; t.f += e.f; t.g += e.g;
    });
    return t;
  }
  // Weight the per-100g maths should divide by. Raw ingredient weight counts
  // water that mostly boils off, so a weighed cooked batch is far more accurate
  // — if one has been recorded, it wins.
  function effectiveWeight(r, scale, rawTotalG) {
    const st = getRecipeState(r.id);
    return st.cookedG ? st.cookedG * scale : rawTotalG;
  }
  // per-100g profile of a recipe as it is currently configured (edits included)
  function recipePer100(r) {
    const st = getRecipeState(r.id);
    const n = computeNutrition(r, 1, st.overrides);
    const w = effectiveWeight(r, 1, n.totalG);
    if (!w) return { kcal: 0, p: 0, c: 0, f: 0 };
    return {
      kcal: n.kcal / w * 100, p: n.p / w * 100,
      c: n.c / w * 100, f: n.f / w * 100
    };
  }
  function logIntake(recipeId, grams) {
    const r = byId[recipeId];
    if (!r || !grams || grams <= 0) return;
    const per = recipePer100(r);
    const mult = grams / 100;
    getDayLog(viewDate).push({
      id: Date.now(), name: r.title, g: grams,
      kcal: per.kcal * mult, p: per.p * mult, c: per.c * mult, f: per.f * mult
    });
    saveState();
  }

  function logPortion(recipeId, eaten, of) {
    const r = byId[recipeId];
    if (!r || !(eaten > 0) || !(of > 0)) return;
    const st = getRecipeState(recipeId);
    const main = computeNutrition(r, st.servings, st.overrides);
    const share = eaten / of;
    getDayLog(viewDate).push({
      id: Date.now(), name: r.title + " (" + fmt1(eaten) + "/" + fmt1(of) + " of batch)",
      g: effectiveWeight(r, st.servings, main.totalG) * share,
      kcal: main.kcal * share, p: main.p * share, c: main.c * share, f: main.f * share
    });
    st.split = of;
    saveState();
  }
  function logProduct(prod, grams) {
    if (!prod || !(grams > 0)) return;
    const mult = grams / 100;
    getDayLog(viewDate).push({
      id: Date.now(), name: prod.name, g: grams,
      kcal: prod.kcal * mult, p: prod.p * mult, c: prod.c * mult, f: prod.f * mult
    });
    saveState();
  }

  function getRecipeState(id) {
    if (!state[id]) state[id] = { servings: 1, checked: {}, custom: [], customSeq: 0, side: null, overrides: {}, macros: {} };
    if (!state[id].custom) state[id].custom = [];
    if (state[id].customSeq === undefined) state[id].customSeq = 0;
    if (state[id].side === undefined) state[id].side = null;
    if (!state[id].overrides) state[id].overrides = {};
    if (!state[id].macros) state[id].macros = {};
    return state[id];
  }

  const FRACS = [
    [0.125, "\u215B"], [0.25, "\u00BC"], [0.333, "\u2153"], [0.375, "\u215C"],
    [0.5, "\u00BD"], [0.625, "\u215D"], [0.667, "\u2154"], [0.75, "\u00BE"], [0.875, "\u215E"]
  ];
  function fmtAmount(n) {
    if (n === null || n === undefined) return "";
    let whole = Math.floor(n + 1e-6);
    let frac = n - whole;
    if (frac < 0.03) return String(whole);
    let best = null, bestDiff = 1;
    FRACS.forEach(([v, sym]) => { const d = Math.abs(frac - v); if (d < bestDiff) { bestDiff = d; best = sym; } });
    if (bestDiff < 0.045) return whole === 0 ? best : whole + best;
    return String(Math.round(n * 100) / 100);
  }
  function fmt1(n) {
    const r = Math.round(n * 10) / 10;
    return r % 1 === 0 ? String(r) : r.toFixed(1);
  }
  function formatWeight(g) {
    let r;
    if (g < 20) r = Math.round(g * 2) / 2;
    else if (g < 1000) r = Math.round(g / 5) * 5;
    else return (Math.round((g / 1000) * 100) / 100) + " kg";
    if (r <= 0) r = 0.5;
    return (r % 1 === 0 ? r : r.toFixed(1)) + " g";
  }

  function gramsForPlain(ing, amount) {
    if (ing.type === "onion") return amount * GF.onion;
    if (ing.type === "banana") return amount * GF.banana;
    if (ing.type === "tomato") return amount * GF.tomato;
    if (ing.type === "egg") return amount * GF.egg;
    if (ing.type === "bread") return amount * GF.bread;
    if (ing.type === "brinjal") return amount * GF.brinjal;
    if (ing.type === "can") return amount * GF.can;
    if (ing.type === "tuna_can") return amount * GF.can;
    if (ing.u === "g") return amount;
    if (ing.u === "ml") return amount * GF.ml;
    if (ing.u === "tsp") return amount * (isOil(ing) ? GF.tspOil : GF.tspSpice);
    if (ing.u === "tbsp") return amount * (isOil(ing) ? GF.tbspOil : GF.tbspSpice);
    return null;
  }

  function baseLabel(ing) {
    if (ing.type === "onion") return "onion" + (ing.note ? ", " + ing.note : "");
    if (ing.type === "banana") return "banana";
    if (ing.type === "tomato") return "tomato" + (ing.note ? ", " + ing.note : "");
    if (ing.type === "bread") return "bread";
    if (ing.type === "tuna_can") return "tuna, drained";
    if (ing.type === "brinjal") return "brinjal";
    return ing.n;
  }

  function buildRows(r, scale, prefs, overrides) {
    const rows = [];
    effectiveIngredients(r, overrides).forEach(ing => {
      const idx = ing._idx;
      if (ing.type === "garlic") {
        const cloves = ing.a * scale;
        let html;
        if (prefs.powder) {
          const tsp = cloves * 0.125;
          if (prefs.weight) html = `<span class="rb-ing-amt">${formatWeight(tsp * GF.garlicPowderTsp)}</span> garlic powder`;
          else html = `<span class="rb-ing-amt">${fmtAmount(tsp)} tsp</span> garlic powder`;
        } else {
          if (prefs.weight) html = `<span class="rb-ing-amt">${formatWeight(cloves * GF.garlicClove)}</span> garlic${ing.note ? ", " + ing.note : ""}`;
          else html = `<span class="rb-ing-amt">${fmtAmount(cloves)}${ing.u ? " " + ing.u : ""}</span> ${ing.n}`;
        }
        rows.push({ key: String(idx), html, editIdx: idx });
        if (prefs.powder) {
          const tsp = cloves * 0.125;
          let gHtml;
          if (prefs.weight) gHtml = `<span class="rb-ing-amt">${formatWeight(tsp * GF.gingerPowderTsp)}</span> ginger powder`;
          else gHtml = `<span class="rb-ing-amt">${fmtAmount(tsp)} tsp</span> ginger powder`;
          rows.push({ key: idx + "_ginger", html: gHtml });
        }
        return;
      }
      if (ing.type === "tomato" && prefs.tomatoPuree) {
        const units = ing.a * scale;
        const tbsp = units * TOMATO_PUREE_TBSP_PER_UNIT;
        let html;
        if (prefs.weight) html = `<span class="rb-ing-amt">${formatWeight(tbsp * GF.tomatoPureeTbsp)}</span> tomato puree`;
        else html = `<span class="rb-ing-amt">${fmtAmount(tbsp)} tbsp</span> tomato puree`;
        rows.push({ key: String(idx), html, editIdx: idx });
        return;
      }
      if (ing.a === null) { rows.push({ key: String(idx), html: ing.n, editIdx: idx }); return; }
      const scaled = ing.a * scale;
      if (prefs.weight) {
        const g = gramsForPlain(ing, scaled);
        if (g !== null) {
          rows.push({ key: String(idx), html: `<span class="rb-ing-amt">${formatWeight(g)}</span> ${baseLabel(ing)}`, editIdx: idx });
          return;
        }
      }
      rows.push({ key: String(idx), html: `<span class="rb-ing-amt">${fmtAmount(scaled)}${ing.u ? " " + ing.u : ""}</span> ${ing.n}`, editIdx: idx });
    });
    return rows;
  }

  function totalRowCount(r, prefs, st) {

  function prettyDate(key) {
    const [y, m, d] = key.split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    const t = todayKey();
    if (key === t) return "Today";
    const yd = new Date(); yd.setDate(yd.getDate() - 1);
    if (key === todayKey(yd)) return "Yesterday";
    return dt.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  }
  function shiftDate(key, days) {
    const [y, m, d] = key.split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    dt.setDate(dt.getDate() + days);
    return todayKey(dt);
  }

  // Where each pantry product is in force: the ingredients it stands in for
  // everywhere, plus any recipes that pinned it to themselves.
  function bindingsFor(code) {
    const out = { everywhere: [], recipes: [] };
    const defs = getDefaults();
    Object.keys(defs).forEach(k => {
      if (defs[k] === code) out.everywhere.push(k.replace(/^name:/, "").replace(/_/g, " "));
    });
    recipes.forEach(r => {
      const st = state[r.id];
      if (!st || !st.macros) return;
      Object.keys(st.macros).forEach(idx => {
        if (st.macros[idx] && st.macros[idx].code === code) out.recipes.push(r.title);
      });
    });
    return out;
  }

  // Every distinct ingredient across all recipes, with how many recipes want it
  // and whether a real product currently stands in for it.
  function allIngredients() {
    const map = {};
    recipes.forEach(r => {
      r.ingredients.forEach(ing => {
        if (ing.a === null && !getNutKey(ing)) return;
        if (ing.code || ing.fixed) return;
        const key = ingredientKey(ing);
        if (!map[key]) {
          const label = String(ing.n || "").split(",")[0].trim() || key.replace(/^name:/, "");
          map[key] = { key: key, label: label, recipes: [], code: null };
        }
        if (map[key].recipes.indexOf(r.title) === -1) map[key].recipes.push(r.title);
      });
    });
    const defs = getDefaults();
    const pantry = getPantry();
    Object.keys(map).forEach(k => {
      const code = defs[k];
      map[k].code = code && pantry[code] ? code : null;
      map[k].product = map[k].code ? pantry[map[k].code] : null;
    });
    return Object.keys(map).map(k => map[k])
      .sort((a, b) => (b.recipes.length - a.recipes.length) || a.label.localeCompare(b.label));
  }
