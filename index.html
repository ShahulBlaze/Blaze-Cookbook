              <span class="rb-need-meta">${it.recipes.length} ${it.recipes.length === 1 ? "recipe" : "recipes"}${it.product ? " &nbsp;\u00B7&nbsp; " + escHtml(it.product.name) : ""}</span>
            </span>
            <span class="rb-need-state ${it.code ? "is-on" : ""}">${it.code ? "\u2713 yours" : "general"}</span>
          </button>`;
      }).join("");
      listHtml = `<p class="rb-log-hint">${covered} of ${items.length} ingredients are running on your own products. Tap any one to scan it or type its figures — it then applies in every recipe that uses it.</p>` + listHtml;
    } else if (!codes.length) {
      listHtml = `<p class="rb-empty">Nothing saved yet. Scan anything from the shop above — or use the Needed list to cover your recipe ingredients.</p>`;
    } else {
      listHtml = codes.map(code => {
        const prod = pantry[code];
        const b = bindingsFor(code);
        let used;
        if (b.everywhere.length) used = `<span class="rb-pan-use is-every">Used for ${b.everywhere.join(", ")} everywhere</span>`;
        else if (b.recipes.length) used = `<span class="rb-pan-use">Used in ${b.recipes.join(", ")}</span>`;
        else used = `<span class="rb-pan-use is-idle">Saved, not in use</span>`;
        return `
          <div class="rb-pan-row">
            <div class="rb-pan-main">
              <div class="rb-pan-name">${escHtml(prod.name)}</div>
              <div class="rb-pan-macros">${prod.kcal} kcal &nbsp;\u00B7&nbsp; ${prod.p}g P &nbsp;\u00B7&nbsp; ${prod.c}g C &nbsp;\u00B7&nbsp; ${prod.f}g F &nbsp;<i>per 100g</i></div>
              ${prod.stores ? `<div class="rb-pan-macros">${storesLine(prod)}</div>` : ""}
              ${used}
              <div class="rb-pan-code">${String(code).indexOf("manual:") === 0 ? "typed by hand" : code}</div>
            </div>
            <button class="rb-custom-remove" data-pantry-del="${code}" type="button" aria-label="Delete product">\u00D7</button>
          </div>`;
      }).join("") + `<p class="rb-log-hint" style="margin-top:16px;">Deleting a product also removes it from the recipes using it, which fall back to the general values.</p>`;
    listHtml += snapInfo
      ? `<p class="rb-data-note">Barcodes are checked against a built-in copy of ${snapInfo.count.toLocaleString("en")} European products (${(snapInfo.slovakia || 0).toLocaleString("en")} sold in Slovakia), updated ${escHtml(snapInfo.built)}, then live online. Product data \u00A9 Open Food Facts contributors, ODbL.</p>`
      : `<p class="rb-data-note">Barcodes are looked up in Open Food Facts. Product data \u00A9 Open Food Facts contributors, ODbL.</p>`;
    }

    body.innerHTML = `
      <button class="rb-back" data-back="1">\u2039 &nbsp;All recipes</button>
      ${tabs}
      ${pantryTab === "mine" ? (pantryAdding ? `
        <div class="rb-side-input-panel" style="margin-bottom:12px;">
          <p class="rb-side-picker-label" style="margin:0 0 8px;">Add a product</p>
          ${pickerHtml("pantry", { select: false })}
          <button class="rb-side-portion-btn" data-padd-save="1" type="button">Save to my pantry</button>
          <button class="rb-side-cancel" data-padd-cancel="1" type="button">Cancel</button>
        </div>` : `<button class="rb-ate-btn" data-padd-open="1" type="button" style="margin-bottom:12px;">▥ &nbsp;Scan a product to add</button>`) : ""}
      ${listHtml}
    `;
  }

  function renderCreate() {
    const d = getDraft();
    headerTitle.textContent = d.editId ? "Edit your recipe" : "Create a recipe";
    headerSub.textContent = "Scan or pick each ingredient, weigh it in — the macros build as you go.";

    let tot = { g: 0, kcal: 0, p: 0, c: 0, f: 0 };
    const rows = d.items.map((it, i) => {
      const m = itemMacros(it);
      const k = it.g / 100;
      tot.g += it.g; tot.kcal += m.kcal * k; tot.p += m.p * k; tot.c += m.c * k; tot.f += m.f * k;
      return `
        <div class="rb-b-row">
          <div class="rb-b-main">
            <div class="rb-b-name">${escHtml(it.name)}${it.nutKey ? ' <i class="rb-bd-tag">general</i>' : ""}</div>
            <div class="rb-b-meta">${Math.round(m.kcal * k)} kcal &nbsp;·&nbsp; ${fmt1(m.p * k)}g protein</div>
          </div>
          <label class="rb-b-g"><input type="number" min="0" step="any" class="rb-b-gin" data-bidx="${i}" value="${it.g}"><span>g</span></label>
          <button class="rb-custom-remove" data-bdel="${i}" type="button" aria-label="Remove">×</button>
        </div>`;
    }).join("");
    const per = tot.g > 0 ? { kcal: tot.kcal / tot.g * 100, p: tot.p / tot.g * 100, c: tot.c / tot.g * 100, f: tot.f / tot.g * 100 } : null;

    const addHtml = builderAdding ? `
      <div class="rb-side-input-panel">
        <p class="rb-side-picker-label" style="margin:0 0 8px;">Add an ingredient</p>
        ${pickerHtml("build", { select: true, general: true })}
        <div class="rb-side-manual-row" style="margin-top:10px;">
          <input type="number" min="0" step="any" class="rb-b-addg" placeholder="grams you put in">
          <span>g</span>
        </div>
        <button class="rb-side-portion-btn" data-badd="1" type="button">Add to the recipe</button>
        <button class="rb-side-cancel" data-badd-cancel="1" type="button">Cancel</button>
      </div>` : `<button class="rb-ate-btn" data-badd-open="1" type="button">+ &nbsp;Add an ingredient</button>`;

    const stepsHtml = d.steps.map((t, i) => `
        <li class="rb-step"><span class="rb-step-num">${i + 1}</span><span class="rb-step-text">${escHtml(t)}</span>
          <button class="rb-custom-remove" data-bstep-del="${i}" type="button" aria-label="Remove step">×</button></li>`).join("");

    const canSave = d.title.trim() && d.items.length;
    body.innerHTML = `
      <label class="rb-b-field">
        <span>Recipe name</span>
        <input type="text" class="rb-add-input rb-b-title" placeholder="e.g. Chicken rice bowl" value="${escHtml(d.title)}">
      </label>

      <h3 class="rb-section-label" style="margin-top:18px;">Ingredients</h3>
      ${rows || `<p class="rb-empty">No ingredients yet. Scan a packet's barcode, pick something you've scanned before, or choose from the general list — then enter how many grams went in.</p>`}
      ${d.items.length ? `
        <div class="rb-b-total">
          <div><b>${Math.round(tot.kcal)}</b> kcal</div><div><b>${fmt1(tot.p)}</b>g protein</div>
          <div><b>${fmt1(tot.c)}</b>g carbs</div><div><b>${fmt1(tot.f)}</b>g fat</div>
        </div>
        <p class="rb-weigh-line">Whole batch, ${Math.round(tot.g)}g of ingredients${per ? ` &nbsp;·&nbsp; ${Math.round(per.kcal)} kcal and ${fmt1(per.p)}g protein per 100g` : ""}</p>` : ""}
      ${addHtml}

      <h3 class="rb-section-label" style="margin-top:22px;">How to cook it <i class="rb-optional">optional</i></h3>
      ${d.steps.length ? `<ol class="rb-steps">${stepsHtml}</ol>` : ""}
      <div class="rb-add-row">
        <input type="text" class="rb-add-input rb-b-step" placeholder="${d.steps.length ? "Next step…" : "First step, e.g. Fry the onion until golden"}">
        <button class="rb-add-btn" data-bstep-add="1" type="button">Add</button>
      </div>

      <button class="rb-calc-btn rb-b-save" data-bsave="1" type="button" ${canSave ? "" : "disabled"}>${d.editId ? "Save changes" : "Save to my recipes"}</button>
      <p class="rb-weigh-line">${canSave ? "Saved recipes appear at the top of the book and can be logged like any other." : "Give it a name and at least one ingredient to save."}</p>
      ${(d.items.length || d.title || d.steps.length) ? `<button class="rb-reset rb-b-discard" data-bdiscard="1" type="button">${d.editId ? "Cancel editing" : "Clear and start over"}</button>` : ""}
      ${myRecipes().length ? `
        <h3 class="rb-section-label" style="margin-top:26px;">Your saved recipes</h3>
        ${myRecipes().map(m => `
          <button class="rb-row" data-open="${m.id}">
            <span class="rb-row-main"><span class="rb-row-title">${escHtml(m.title)}</span>
            <span class="rb-row-meta">${m.items.length} ingredients${m.steps && m.steps.length ? " · " + m.steps.length + " steps" : ""}</span></span>
            <span class="rb-chevron">›</span>
          </button>`).join("")}` : ""}
    `;
  }

  function statBox(num, label) {
    const cls = "rb-stat-" + label.replace(/[^a-z]/gi, "").toLowerCase();
    return `<div class="rb-stat ${cls}"><div class="rb-stat-num">${num}</div><div class="rb-stat-label">${label}</div></div>`;
  }

  function renderSideSection(r, st) {
    if (!r.sidesEligible) return "";
    const picking = sidePicking[r.id];
    let html = `<h3 class="rb-section-label" style="margin-top:22px;">Optional side</h3>`;

    if (st.side) {
      const cfg = sideTypeByKey[st.side.type];
      const n = NUT[cfg.nut];
      const g = st.side.grams;
      const kcal = g * n.kcal / 100, p = g * n.p / 100, c = g * n.c / 100, f = g * n.f / 100;
      const checked = !!st.checked["side"];
      html += `
        <label class="rb-ing-row">
          <input type="checkbox" class="rb-ing-check" data-key="side" ${checked ? "checked" : ""}>
          <span class="rb-box"></span>
          <span class="rb-ing-text"><span class="rb-ing-amt">${formatWeight(g)}</span> ${cfg.label.toLowerCase()} (${cfg.note})</span>
          <button class="rb-custom-remove" data-side-remove="1" type="button">\u00D7</button>
        </label>
        <p class="rb-side-added-sub">Adds ${Math.round(kcal)} kcal &nbsp;\u00B7&nbsp; ${Math.round(p * 10) / 10}g protein &nbsp;\u00B7&nbsp; ${Math.round(c * 10) / 10}g carbs &nbsp;\u00B7&nbsp; ${Math.round(f * 10) / 10}g fat to the total.</p>`;
    } else if (picking) {
      const cfg = sideTypeByKey[picking];
      html += `
        <p class="rb-side-picker-label">${cfg.label} — pick an amount</p>
        <div class="rb-side-input-panel">
          <button class="rb-side-portion-btn" data-side-portion="1" type="button">1 portion — ~${cfg.portion}g (${cfg.note})</button>
          <div class="rb-side-manual-row">
            <input type="number" min="1" step="1" class="rb-side-manual-input" placeholder="e.g. 120">
            <span>g</span>
            <button class="rb-add-btn" data-side-manual-add="1" type="button">Add</button>
          </div>
          <button class="rb-side-cancel" data-side-cancel="1" type="button">Cancel</button>
        </div>`;
    } else {
      html += `
        <p class="rb-side-picker-label">Not part of the dish itself — add one if you want it with this meal</p>
        <div class="rb-side-chips">
          ${SIDE_TYPES.map(s => `<button class="rb-side-chip" data-side-chip="${s.key}" type="button">${s.label}</button>`).join("")}
        </div>`;
    }
    return html;
  }

  function renderRecipe(id) {
    const r = byId[id];
    const st = getRecipeState(id);
    const prefs = getPrefs();
    const scale = st.servings;

    headerTitle.textContent = r.title;
    headerSub.textContent = r.cat;

    const main = computeNutrition(r, scale, st.overrides);
    const sideNut = computeSideNut(st.side);
    const priceStr = r.price !== null
      ? "\u20AC" + (r.price * scale).toFixed(2) + (r.tracked ? " (tracked)" : "")
      : "\u2014";

    const dishG = effectiveWeight(r, scale, main.totalG);
    const per100 = dishG > 0 ? {
      kcal: main.kcal / dishG * 100, p: main.p / dishG * 100,
      c: main.c / dishG * 100, f: main.f / dishG * 100
    } : { kcal: 0, p: 0, c: 0, f: 0 };

    const hasGarlic = r.ingredients.some(i => i.type === "garlic");
    const hasTomato = r.ingredients.some(i => i.type === "tomato");
    const rows = buildRows(r, scale, prefs, st.overrides);

    function ingRowHtml(row) {
      if (row.editIdx !== undefined && editingIng[id] === row.editIdx) {
        const ing = r.ingredients[row.editIdx];
        const ov = st.overrides[row.editIdx];
        const curAmount = ov && ov.amount !== undefined ? ov.amount : ing.a;
        if (ing.a === null) {
          return `
            <div class="rb-side-input-panel" style="margin:6px 0;">
              <p class="rb-side-picker-label" style="margin:0;">${ing.n}</p>
              <button class="rb-side-cancel" data-edit-remove="${row.editIdx}" type="button">Remove ingredient</button>
              <button class="rb-side-cancel" data-edit-cancel="1" type="button">Cancel</button>
            </div>`;
        }
        return `
          <div class="rb-side-input-panel" style="margin:6px 0;">
            <p class="rb-side-picker-label" style="margin:0;">${ing.n}</p>
            <div class="rb-side-manual-row">
              <input type="number" min="0" step="any" class="rb-edit-amount-input" value="${curAmount}">
              <span>${ing.u || "count"}</span>
            </div>
            <button class="rb-side-portion-btn" data-edit-save="${row.editIdx}" type="button">Save</button>
            <button class="rb-side-cancel" data-edit-remove="${row.editIdx}" type="button">Remove ingredient</button>
            <button class="rb-side-cancel" data-edit-cancel="1" type="button">Cancel</button>
          </div>`;
      }
      if (row.editIdx !== undefined && macroEditing && macroEditing.id === id && macroEditing.idx === row.editIdx) {
        const m = macroEditing.scanned || st.macros[row.editIdx] || {};
        const shot = macroEditing.photo || null;
        const key = getNutKey(r.ingredients[row.editIdx]);
        const ref = key && NUT[key] ? NUT[key] : null;
        return `
          <div class="rb-side-input-panel" style="margin:6px 0;">
            <p class="rb-side-picker-label" style="margin:0 0 8px;">${r.ingredients[row.editIdx].n}</p>
            ${(() => {
              const cur = resolveMacro(r.id, r.ingredients[row.editIdx], row.editIdx, st);
              if (cur.source === "general") return `<p class="rb-log-hint" style="margin-top:0;">Scan the barcode to fill these in automatically, or photograph the label and type them yourself.</p>`;
              const where = { everywhere: "in every recipe", recipe: "in this recipe", once: "for this cook only" }[cur.source];
              return `<p class="rb-scan-result is-ok" style="margin-top:0;">Now using <b>${cur.prod && cur.prod.name ? escHtml(cur.prod.name) : "your own values"}</b> ${where}.</p>`;
            })()}
            ${scanRow("data-scan-for", row.editIdx, "data-gallery-for", row.editIdx, "data-typecode-for", row.editIdx)}
            ${macroEditing.scanMsg ? `<p class="rb-scan-result ${macroEditing.scanOk ? "is-ok" : "is-bad"}">${macroEditing.scanMsg}</p>` : ""}
            ${macroEditing.product ? `
              <div class="rb-scope">
                <p class="rb-scope-name">${escHtml(macroEditing.product.name)}</p>
                <p class="rb-scope-macros">${macroEditing.product.kcal} kcal &nbsp;\u00B7&nbsp; ${macroEditing.product.p}g P &nbsp;\u00B7&nbsp; ${macroEditing.product.c}g C &nbsp;\u00B7&nbsp; ${macroEditing.product.f}g F &nbsp;<i>per 100g</i></p>
                ${macroEditing.product.stores ? `<p class="rb-scope-macros" style="margin-top:-8px;">${storesLine(macroEditing.product)}</p>` : ""}
                <p class="rb-scope-q">Where should this product apply?</p>
                <button class="rb-scope-btn" data-scope="everywhere" type="button">
                  <b>Everywhere</b><span>Every recipe using ${ingLabelFor(r, row.editIdx)}, from now on</span>
                </button>
                <button class="rb-scope-btn" data-scope="recipe" type="button">
                  <b>This recipe only</b><span>Just ${r.title}, saved for next time</span>
                </button>
                <button class="rb-scope-btn" data-scope="once" type="button">
                  <b>Just this once</b><span>This cook only \u2014 forgotten when you close the app</span>
                </button>
              </div>` : ""}
            ${shot ? `<img class="rb-label-shot" src="${shot}" alt="label">` : ""}
            <label class="rb-photo-btn">
              ${shot ? "Retake photo" : "\uD83D\uDCF7 &nbsp;Take photo of label"}
              <input type="file" accept="image/*" capture="environment" class="rb-photo-input" data-photo-for="${row.editIdx}">
            </label>
            <div class="rb-macro-grid">
              <label><span>kcal</span><input type="number" min="0" step="any" class="rb-m-kcal" value="${m.kcal !== undefined ? m.kcal : ""}" placeholder="${ref ? ref.kcal : ""}"></label>
              <label><span>protein</span><input type="number" min="0" step="any" class="rb-m-p" value="${m.p !== undefined ? m.p : ""}" placeholder="${ref ? ref.p : ""}"></label>
              <label><span>carbs</span><input type="number" min="0" step="any" class="rb-m-c" value="${m.c !== undefined ? m.c : ""}" placeholder="${ref ? ref.c : ""}"></label>
              <label><span>fat</span><input type="number" min="0" step="any" class="rb-m-f" value="${m.f !== undefined ? m.f : ""}" placeholder="${ref ? ref.f : ""}"></label>
            </div>
            <p class="rb-log-hint">${ref ? `Greyed numbers are the general values in use now.` : `No general value for this one \u2014 it currently counts as zero.`}</p>
            <button class="rb-side-portion-btn" data-macro-save="${row.editIdx}" type="button">Save for this recipe</button>
            ${resolveMacro(r.id, r.ingredients[row.editIdx], row.editIdx, st).source !== "general"
              ? `<button class="rb-side-cancel" data-macro-clear="${row.editIdx}" type="button">Back to the general value</button>` : ""}
            <button class="rb-side-cancel" data-macro-cancel="1" type="button">Cancel</button>
          </div>`;
      }
      const checked = !!st.checked[row.key];
      const src = row.editIdx !== undefined
        ? resolveMacro(r.id, r.ingredients[row.editIdx], row.editIdx, st).source : "general";
      const srcTitle = { everywhere: "Your product, used everywhere", recipe: "Your product, this recipe", once: "Your product, just this cook" }[src] || "Macros from the packet";
      const editBtn = row.editIdx !== undefined
        ? `<button class="rb-custom-remove" data-edit-ing="${row.editIdx}" type="button" aria-label="Edit or remove">\u270E</button>` : "";
      const macroBtn = row.editIdx !== undefined
        ? `<button class="rb-macro-btn src-${src}" data-macro-ing="${row.editIdx}" type="button" title="${srcTitle}" aria-label="${srcTitle}">\uD83C\uDFF7</button>` : "";
      return `
        <label class="rb-ing-row">
          <input type="checkbox" class="rb-ing-check" data-key="${row.key}" ${checked ? "checked" : ""}>
          <span class="rb-box"></span>
          <span class="rb-ing-text">${row.html}</span>
          ${macroBtn}
          ${editBtn}
        </label>`;
    }
    let mainIngHtml = rows.map(ingRowHtml).join("");

    let removedHtml = "";
    const removedIdxs = Object.keys(st.overrides).filter(k => st.overrides[k] && st.overrides[k].removed);
    if (removedIdxs.length) {
      removedHtml = `<p class="rb-side-picker-label" style="margin:10px 0 6px;">Removed — tap to restore:</p><div class="rb-side-chips">` +
        removedIdxs.map(idx => `<button class="rb-side-chip" data-restore-ing="${idx}" type="button">${r.ingredients[idx].n}</button>`).join("") +
        `</div>`;
    }

    let customHtml = "";
    st.custom.forEach(c => {
      const key = "custom_" + c.id;
      const checked = !!st.checked[key];
      customHtml += `
        <label class="rb-ing-row">
          <input type="checkbox" class="rb-ing-check" data-key="${key}" ${checked ? "checked" : ""}>
          <span class="rb-box"></span>
          <span class="rb-ing-text">${c.text}</span>
          <button class="rb-custom-remove" data-remove-custom="${c.id}" type="button">\u00D7</button>
        </label>`;
    });

    const total = totalRowCount(r, prefs, st);
    const doneCount = Object.values(st.checked).filter(Boolean).length;
    const hasEdits = Object.keys(st.overrides).length > 0 || st.custom.length > 0 || Object.keys(st.macros).length > 0;
    const measuredCount = Object.keys(st.macros).length;
    const countableIng = r.ingredients.filter(i => i.a !== null).length;
    const showBreakdown = breakdownOpen === r.id;
    const breakdown = showBreakdown ? nutritionBreakdown(r, scale, st.overrides) : [];

    const stepsHtml = `<ol class="rb-steps">${r.steps.map((s, i) => `
        <li class="rb-step"><span class="rb-step-num">${i + 1}</span><span class="rb-step-text">${s}</span></li>`).join("")}</ol>`;

    const hasSide = st.side !== null;
    const combined = hasSide ? {
      totalG: main.totalG + sideNut.totalG, kcal: main.kcal + sideNut.kcal,
      p: main.p + sideNut.p, c: main.c + sideNut.c, f: main.f + sideNut.f
    } : null;

    body.innerHTML = `
      <button class="rb-back" data-back="1">\u2039 &nbsp;All recipes</button>
      <h1 class="rb-recipe-title">${escHtml(r.title)}</h1>
      ${r.mine ? `<div class="rb-reset-row" style="margin:-4px 0 14px;">
        <button class="rb-reset" data-medit="${r.id}" type="button">Edit recipe</button>
        <button class="rb-reset" data-mdel="${r.id}" type="button">Delete</button></div>` : ""}

      <p class="rb-stats-caption">Per 100 g of the finished dish</p>
      <div class="rb-stats-grid rb-stats-grid-4">
        ${statBox(Math.round(per100.kcal), "kcal")}
        ${statBox(fmt1(per100.p) + "g", "protein")}
        ${statBox(fmt1(per100.c) + "g", "carbs")}
        ${statBox(fmt1(per100.f) + "g", "fat")}
      </div>
      ${logPicking === r.id ? `
        <div class="rb-side-input-panel">
          <p class="rb-side-picker-label" style="margin:0 0 8px;">How much did you eat?</p>
          ${logModeSeg()}
          ${(getPrefs().logMode || "g") === "portion" ? `
            ${portionInputs(defaultSplit(r.id))}
            <p class="rb-log-hint">No weighing: the whole batch (${st.servings} ${st.servings === 1 ? "serving" : "servings"}) is ${Math.round(main.kcal)} kcal and ${Math.round(main.p)}g protein, so one of ${defaultSplit(r.id)} portions is ${Math.round(main.kcal / defaultSplit(r.id))} kcal.</p>` : `
            <div class="rb-side-manual-row">
              <input type="number" min="0" step="any" class="rb-log-grams" placeholder="grams on your plate">
              <span>g</span>
            </div>
            <p class="rb-log-hint">At ${Math.round(per100.kcal)} kcal / 100 g. One whole batch is ${Math.round(dishG)}g.</p>`}
          <button class="rb-side-portion-btn" data-log-save="${r.id}" type="button">Log it</button>
          <button class="rb-side-cancel" data-log-cancel="1" type="button">Cancel</button>
        </div>`
      : `<button class="rb-ate-btn" data-log-open="${r.id}" type="button">+ &nbsp;Log what I ate</button>`}
      <p class="rb-per100">Whole batch \u2014 ${Math.round(dishG)}g &nbsp;\u00B7&nbsp; ${Math.round(main.kcal)} kcal &nbsp;\u00B7&nbsp; ${Math.round(main.p)}g protein &nbsp;\u00B7&nbsp; ${Math.round(main.c)}g carbs &nbsp;\u00B7&nbsp; ${Math.round(main.f)}g fat &nbsp;\u00B7&nbsp; ${priceStr}</p>
      ${weighEditing === r.id ? `
        <div class="rb-side-input-panel">
          <p class="rb-side-picker-label" style="margin:0 0 8px;">Actual weight of the cooked batch</p>
          <div class="rb-side-manual-row">
            <input type="number" min="0" step="any" class="rb-cooked-input" value="${st.cookedG ? Math.round(st.cookedG * scale) : ""}" placeholder="grams">
            <span>g</span>
          </div>
          <p class="rb-log-hint">No need to lift the pot: put each storage box on the scale, press tare, fill it, and add the readings up. Raw ingredients come to ${Math.round(main.totalG)}g.</p>
          <button class="rb-side-portion-btn" data-cooked-save="${r.id}" type="button">Save</button>
          ${st.cookedG ? `<button class="rb-side-cancel" data-cooked-clear="${r.id}" type="button">Use raw weight instead</button>` : ""}
          <button class="rb-side-cancel" data-cooked-cancel="1" type="button">Cancel</button>
        </div>`
      : `<p class="rb-weigh-line">${st.cookedG
          ? `Using your weighed cooked batch. <button class="rb-linkbtn" data-cooked-edit="${r.id}" type="button">Change</button>`
          : `Based on raw ingredient weight. Logging by portion of the batch needs no weight at all. <button class="rb-linkbtn" data-cooked-edit="${r.id}" type="button">Weighed it?</button>`}</p>`}
      ${hasSide ? `<p class="rb-combined-line">Meal total incl. side: ${Math.round(combined.totalG)}g &nbsp;\u00B7&nbsp; ${Math.round(combined.kcal)} kcal &nbsp;\u00B7&nbsp; ${Math.round(combined.p)}g protein &nbsp;\u00B7&nbsp; ${Math.round(combined.c)}g carbs &nbsp;\u00B7&nbsp; ${Math.round(combined.f)}g fat</p>` : `<div style="margin-bottom:18px;"></div>`}

      <div class="rb-servings-row">
        <span class="rb-servings-label">Servings</span>
        <div class="rb-stepper">
          <button data-dec="1" ${st.servings <= 1 ? "disabled" : ""}>\u2212</button>
          <span class="rb-stepper-val">${st.servings}</span>
          <button data-inc="1" ${st.servings >= 10 ? "disabled" : ""}>+</button>
        </div>
      </div>

      ${miniTogglePanelHtml(hasGarlic, hasTomato)}

      <h3 class="rb-section-label">Ingredients</h3>
      <p class="rb-ing-progress">${doneCount} of ${total} ready</p>
      ${mainIngHtml}
      ${removedHtml}
      ${customHtml}
      <div class="rb-add-row">
        <input type="text" class="rb-add-input" placeholder="Add an ingredient…">
        <button class="rb-add-btn" data-add-ing="1" type="button">Add</button>
      </div>
      <button class="rb-calc-btn" data-calc="1" type="button">${calcFlash === r.id ? "✓ &nbsp;Recalculated" : "Calculate macros"}</button>
      <p class="rb-weigh-line">${measuredCount
        ? `${measuredCount} of ${countableIng} ingredients using your own packet values; the rest use general ones.`
        : `All ingredients using general values. Tap 🏷 on any one to enter what the packet says.`}</p>

      ${showBreakdown ? `
        <div class="rb-breakdown">
          <div class="rb-bd-head"><span>ingredient</span><span>g</span><span>kcal</span><span>prot</span></div>
          ${breakdown.map(b => `
            <div class="rb-bd-row${b.known ? "" : " is-unknown"}">
              <span class="rb-bd-name">${b.name}${b.measured ? ' <i class="rb-bd-tag">yours</i>' : ""}${b.known ? "" : ' <i class="rb-bd-tag">no data</i>'}</span>
              <span>${Math.round(b.g)}</span>
              <span>${Math.round(b.kcal)}</span>
              <span>${fmt1(b.p)}</span>
            </div>`).join("")}
          <div class="rb-bd-row rb-bd-total">
            <span class="rb-bd-name">Total</span>
            <span>${Math.round(main.totalG)}</span>
            <span>${Math.round(main.kcal)}</span>
            <span>${fmt1(main.p)}</span>
          </div>
          <p class="rb-log-hint">Divided by the ${st.cookedG ? "weighed cooked" : "raw"} batch weight of ${Math.round(dishG)}g, that is ${Math.round(per100.kcal)} kcal and ${fmt1(per100.p)}g protein per 100g.</p>
        </div>` : ""}

      <div class="rb-reset-row">
        <button class="rb-reset" data-breakdown="1">${showBreakdown ? "Hide" : "Show"} the maths</button>
        <button class="rb-reset" data-reset="1" ${doneCount === 0 ? "disabled" : ""}>Uncheck all</button>
        <button class="rb-reset" data-reset-ingredients="1" ${hasEdits ? "" : "disabled"}>Reset ingredients to default</button>
      </div>

      ${renderSideSection(r, st)}

      ${r.steps.length ? `<h3 class="rb-section-label" style="margin-top:22px;">Method</h3>
      ${stepsHtml}` : ""}
    `;
  }

  function macroCodeFound(target, code) {
    if (!macroEditing || macroEditing.id !== target.id || macroEditing.idx !== target.idx) return;
      macroEditing.scanMsg = "Looking up " + code + "…";
      macroEditing.scanOk = true;
      render();
      lookupBarcode(code).then(entry => {
        if (!macroEditing || macroEditing.id !== target.id || macroEditing.idx !== target.idx) return;
        macroEditing.scanned = { kcal: entry.kcal, p: entry.p, c: entry.c, f: entry.f };
        macroEditing.product = entry;
        macroEditing.scanMsg = null;
        macroEditing.scanOk = true;
        render();
      }).catch(err => {
        if (!macroEditing || macroEditing.id !== target.id || macroEditing.idx !== target.idx) return;
        const why = err && err.message;
        macroEditing.scanMsg =
          why === "notfound" ? "Barcode " + code + " isn't in the food database — type the values from the label."
          : why === "nonutrition" ? "That product is listed but has no nutrition figures — type them from the label."
          : "Couldn't reach the food database. Type the values, or try again when you have signal.";
        macroEditing.scanOk = false;
        render();
      });
  }

  function needCodeFound(key, code) {
    if (!pantryEditing || pantryEditing.key !== key) return;
      pantryEditing.scanMsg = "Looking up " + code + "\u2026";
      pantryEditing.scanOk = true;
      render();
      lookupBarcode(code).then(entry => {
        if (!pantryEditing || pantryEditing.key !== key) return;
        pantryEditing.product = entry;
        pantryEditing.scanned = { kcal: entry.kcal, p: entry.p, c: entry.c, f: entry.f };
        pantryEditing.scanMsg = null;
        render();
      }).catch(err => {
        if (!pantryEditing || pantryEditing.key !== key) return;
        const why = err && err.message;
        pantryEditing.scanMsg =
          why === "notfound" ? "Barcode " + code + " isn't in the food database \u2014 type the values from the label."
          : why === "nonutrition" ? "That product is listed but has no nutrition figures \u2014 type them from the label."
          : "Couldn't reach the food database. Type the values, or try again when you have signal.";
        pantryEditing.scanOk = false;
        render();
      });
  }

  function r_byId(id) { return byId[id]; }

  function render() {
    const tabFor = view === "recipe" || view === "home" ? "home" : view;
    document.querySelectorAll("#rb-tabbar [data-nav]").forEach(b =>
      b.classList.toggle("is-on", b.getAttribute("data-nav") === tabFor));
    if (view === "create") renderCreate();
    else if (view === "pantry") renderPantry();
    else if (view === "intake") renderIntake();
    else if (currentId) renderRecipe(currentId);
    else renderHome();
  }

  // In-app navigation history, so the phone's back button/gesture steps back
  // through the app (recipe -> home) instead of closing it outright.
  function openRecipe(id) {
    currentId = id;
    view = "recipe";
    logPicking = null;
    weighEditing = null;
    macroEditing = null;
    history.pushState({ rb: "recipe", id }, "", "#" + id);
    render();
    body.scrollTo(0, 0);
  }
  function openIntake() {
    currentId = null;
    view = "intake";
    logPicking = null;
    weighEditing = null;
    macroEditing = null;
    goalEditing = false;
    viewDate = todayKey();
    history.pushState({ rb: "intake" }, "", "#intake");
    render();
    body.scrollTo(0, 0);
  }
  function openPantry() {
    currentId = null;
    view = "pantry";
    logPicking = null; weighEditing = null; macroEditing = null; pantryEditing = null;
    history.pushState({ rb: "pantry" }, "", "#pantry");
    render();
    if (!snapInfo) snapshotIndex().then(j => { if (j && view === "pantry") render(); });
    body.scrollTo(0, 0);
  }
  function openCreate() {
    currentId = null;
    view = "create";
    logPicking = null; weighEditing = null; macroEditing = null; builderAdding = false;
    history.pushState({ rb: "create" }, "", "#create");
    render();
    window.scrollTo(0, 0);
  }
  function goHome(fromPop) {
    currentId = null;
    view = "home";
    logPicking = null;
    weighEditing = null;
    macroEditing = null;
    if (!fromPop) history.pushState({ rb: "home" }, "", location.pathname + location.search);
    render();
    body.scrollTo(0, 0);
  }
  window.addEventListener("popstate", (e) => {
    const st = e.state;
    logPicking = null;
    weighEditing = null;
    macroEditing = null;
    if (st && st.rb === "recipe" && byId[st.id]) { currentId = st.id; view = "recipe"; }
    else if (st && st.rb === "intake") { currentId = null; view = "intake"; viewDate = viewDate || todayKey(); }
    else if (st && st.rb === "pantry") { currentId = null; view = "pantry"; }
    else if (st && st.rb === "create") { currentId = null; view = "create"; }
    else { currentId = null; view = "home"; }
    render();
  });

  function tryAddIngredient() {
    if (!currentId) return;
    const input = body.querySelector(".rb-add-input");
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;
    const st = getRecipeState(currentId);
    st.customSeq++;
    st.custom.push({ id: st.customSeq, text });
    saveState();
    render();
  }

  function commitSide(type, grams) {
    if (!currentId || !grams || grams <= 0) return;
    const st = getRecipeState(currentId);
    st.side = { type, grams };
    delete sidePicking[currentId];
    saveState();
    render();
  }

  root.addEventListener("click", (e) => {
    const openBtn = e.target.closest("[data-open]");
    if (openBtn) { openRecipe(openBtn.getAttribute("data-open")); return; }

    const backBtn = e.target.closest("[data-back]");
    if (backBtn) { history.back(); return; }

    const navBtn = e.target.closest("[data-nav]");
    if (navBtn) {
      const to = navBtn.getAttribute("data-nav");
      const tabFor = view === "recipe" || view === "home" ? "home" : view;
      if (to === tabFor && to !== "home") { window.scrollTo(0, 0); return; }
      if (to === "home") goHome();
      else if (to === "intake") openIntake();
      else if (to === "create") openCreate();
      else if (to === "pantry") openPantry();
      return;
    }

    // shared product picker
    const ppScan = e.target.closest("[data-pp-scan]");
    if (ppScan) { pickerScan(ppScan.getAttribute("data-pp-scan")); return; }
    const ppType = e.target.closest("[data-pp-typecode]");
    if (ppType) {
      const code = askBarcodeNumber();
      if (code) pickerHandleCode(ppType.getAttribute("data-pp-typecode"), code);
      return;
    }
    const ppManual = e.target.closest("[data-pp-manual]");
    if (ppManual) {
      const pk = picker(ppManual.getAttribute("data-pp-manual"));
      pk.manual = true; pk.product = null; pk.msg = null;
      render(); return;
    }

    // daily intake: log mode, shop products
    const modeBtn = e.target.closest("[data-logmode]");
    if (modeBtn) { getPrefs().logMode = modeBtn.getAttribute("data-logmode"); saveState(); render(); return; }
    const pLogBtn = e.target.closest("[data-plog]");
    if (pLogBtn) {
      const prod = pickerResult("intake");
      const gEl = body.querySelector(".rb-log-pgrams");
      const grams = gEl ? parseFloat(gEl.value) : NaN;
      if (!prod) { const pk = picker("intake"); pk.msg = "Scan, pick or type a product first."; pk.ok = false; render(); return; }
      if (isNaN(grams) || grams <= 0) { if (gEl) gEl.focus(); return; }
      if (!prod.nutKey) getPantry()[prod.code] = pantryRecord(prod);
      logProduct(prod, grams);
      resetPicker("intake");
      logPicking = null;
      render(); return;
    }

    // pantry: add any product
    const pAddOpen = e.target.closest("[data-padd-open]");
    if (pAddOpen) { resetPicker("pantry"); pantryAdding = true; render(); return; }
    const pAddCancel = e.target.closest("[data-padd-cancel]");
    if (pAddCancel) { resetPicker("pantry"); pantryAdding = false; render(); return; }
    const pAddSave = e.target.closest("[data-padd-save]");
    if (pAddSave) {
      const prod = pickerResult("pantry");
      if (!prod) { const pk = picker("pantry"); pk.msg = "Scan a barcode or type the product in first."; pk.ok = false; render(); return; }
      getPantry()[prod.code] = pantryRecord(prod);
      resetPicker("pantry"); pantryAdding = false;
      saveState(); render(); return;
    }

    // recipe builder
    const bAddOpen = e.target.closest("[data-badd-open]");
    if (bAddOpen) { resetPicker("build"); builderAdding = true; render(); return; }
    const bAddCancel = e.target.closest("[data-badd-cancel]");
    if (bAddCancel) { resetPicker("build"); builderAdding = false; render(); return; }
    const bAdd = e.target.closest("[data-badd]");
    if (bAdd) {
      const prod = pickerResult("build");
      const gEl = body.querySelector(".rb-b-addg");
      const grams = gEl ? parseFloat(gEl.value) : NaN;
      if (!prod) { const pk = picker("build"); pk.msg = "Scan, pick or type an ingredient first."; pk.ok = false; render(); return; }
      if (isNaN(grams) || grams <= 0) { if (gEl) gEl.focus(); return; }
      const d = getDraft();
      if (prod.nutKey) d.items.push({ name: prod.name, g: grams, nutKey: prod.nutKey });
      else {
        getPantry()[prod.code] = pantryRecord(prod);
        d.items.push({ name: prod.name, g: grams, code: prod.code, kcal: prod.kcal, p: prod.p, c: prod.c, f: prod.f });
      }
      resetPicker("build"); builderAdding = false;
      saveState(); render(); return;
    }
    const bDel = e.target.closest("[data-bdel]");
    if (bDel) { getDraft().items.splice(Number(bDel.getAttribute("data-bdel")), 1); saveState(); render(); return; }
    const bStepAdd = e.target.closest("[data-bstep-add]");
    if (bStepAdd) {
      const el = body.querySelector(".rb-b-step");
      const t = el ? el.value.trim() : "";
      if (t) { getDraft().steps.push(t); saveState(); render(); const n = body.querySelector(".rb-b-step"); if (n) n.focus(); }
      return;
    }
    const bStepDel = e.target.closest("[data-bstep-del]");
    if (bStepDel) { getDraft().steps.splice(Number(bStepDel.getAttribute("data-bstep-del")), 1); saveState(); render(); return; }
    const bDiscard = e.target.closest("[data-bdiscard]");
    if (bDiscard) {
      if (!confirm(getDraft().editId ? "Stop editing? Changes are discarded." : "Clear this recipe and start over?")) return;
      state._draft = null; builderAdding = false; resetPicker("build");
      saveState(); render(); return;
    }
    const bSave = e.target.closest("[data-bsave]");
    if (bSave && !bSave.disabled) {
      const d = getDraft();
      const titleEl = body.querySelector(".rb-b-title");
      if (titleEl) d.title = titleEl.value;
      if (!d.title.trim() || !d.items.length) return;
      const list = myRecipes();
      let id = d.editId;
      const entry = { id: id || ("m" + Date.now()), title: d.title.trim(), items: d.items.slice(), steps: d.steps.slice() };
      if (id) {
        const k = list.findIndex(m => m.id === id);
        if (k >= 0) list[k] = entry; else list.unshift(entry);
        if (state[id]) { state[id].overrides = {}; state[id].macros = {}; state[id].checked = {}; delete state[id].cookedG; }
      } else {
        list.unshift(entry);
      }
      id = entry.id;
      state._draft = null;
      syncMyRecipes();
      saveState();
      openRecipe(id);
      return;
    }
    const mEdit = e.target.closest("[data-medit]");
    if (mEdit) {
      const m = myRecipes().find(x => x.id === mEdit.getAttribute("data-medit"));
      if (!m) return;
      state._draft = { editId: m.id, title: m.title, items: m.items.map(x => Object.assign({}, x)), steps: (m.steps || []).slice() };
      saveState(); openCreate(); return;
    }
    const mDel = e.target.closest("[data-mdel]");
    if (mDel) {
      const id = mDel.getAttribute("data-mdel");
      const m = myRecipes().find(x => x.id === id);
      if (!m || !confirm("Delete “" + m.title + "”? This can't be undone.")) return;
      state._myRecipes = myRecipes().filter(x => x.id !== id);
      delete state[id];
      syncMyRecipes();
      saveState(); goHome(); return;
    }

    const intakeBtn = e.target.closest("[data-intake]");
    if (intakeBtn) { openIntake(); return; }

    const pantryBtn = e.target.closest("[data-pantry]");
    if (pantryBtn) { openPantry(); return; }

    const ptabBtn = e.target.closest("[data-ptab]");
    if (ptabBtn) { pantryTab = ptabBtn.getAttribute("data-ptab"); pantryEditing = null; render(); return; }

    const pEditBtn = e.target.closest("[data-pedit]");
    if (pEditBtn) {
      const key = pEditBtn.getAttribute("data-pedit");
      const it = allIngredients().filter(x => x.key === key)[0];
      pantryEditing = { key: key, label: it ? it.label : key, product: null, scanned: null, scanMsg: null, scanOk: true };
      render(); return;
    }
    const pCancelBtn = e.target.closest("[data-pcancel]");
    if (pCancelBtn) { pantryEditing = null; render(); return; }

    const pScanBtn = e.target.closest("[data-pscan]");
    if (pScanBtn && pantryEditing) {
      const key = pantryEditing.key;
      openScanner(code => needCodeFound(key, code));
      return;
    }
    const pTypeBtn = e.target.closest("[data-ptypecode]");
    if (pTypeBtn && pantryEditing) {
      const code = askBarcodeNumber();
      if (code) needCodeFound(pantryEditing.key, code);
      return;
    }

    const pSaveBtn = e.target.closest("[data-psave]");
    if (pSaveBtn && pantryEditing) {
      const num = cls => {
        const el = body.querySelector(cls);
        const v = el ? parseFloat(el.value) : NaN;
        return isNaN(v) || v < 0 ? null : v;
      };
      const kcal = num(".rb-m-kcal"), pp = num(".rb-m-p"), cc = num(".rb-m-c"), ff = num(".rb-m-f");
      if (kcal === null && pp === null && cc === null && ff === null) { pantryEditing = null; render(); return; }
      const prod = pantryEditing.product;
      const code = prod ? prod.code : ("manual:" + pantryEditing.key);
      getPantry()[code] = {
        code: code,
        name: prod ? prod.name : pantryEditing.label,
        kcal: kcal === null ? 0 : kcal, p: pp === null ? 0 : pp,
        c: cc === null ? 0 : cc, f: ff === null ? 0 : ff
      };
      getDefaults()[pantryEditing.key] = code;
      pantryEditing = null;
      saveState(); render(); return;
    }

    const pClearBtn = e.target.closest("[data-pclear]");
    if (pClearBtn && pantryEditing) {
      delete getDefaults()[pantryEditing.key];
      pantryEditing = null;
      saveState(); render(); return;
    }

    const panDelBtn = e.target.closest("[data-pantry-del]");
    if (panDelBtn) {
      const code = panDelBtn.getAttribute("data-pantry-del");
      delete getPantry()[code];
      const defs = getDefaults();
      Object.keys(defs).forEach(k => { if (defs[k] === code) delete defs[k]; });
      recipes.forEach(r => {
        const st = state[r.id];
        if (!st || !st.macros) return;
        Object.keys(st.macros).forEach(idx => {
          if (st.macros[idx] && st.macros[idx].code === code) delete st.macros[idx];
        });
      });
      Object.keys(tempMacros).forEach(k => { if (tempMacros[k] && tempMacros[k].code === code) delete tempMacros[k]; });
      saveState(); render(); return;
    }

    const dayBtn = e.target.closest("[data-day]");
    if (dayBtn && !dayBtn.disabled) {
      const next = shiftDate(viewDate, Number(dayBtn.getAttribute("data-day")));
      if (next <= todayKey()) { viewDate = next; logPicking = null; render(); }
      return;
    }

    const logOpenBtn = e.target.closest("[data-log-open]");
    if (logOpenBtn) {
      logPicking = logOpenBtn.getAttribute("data-log-open");
      if (logPicking === "__product__") resetPicker("intake");
      render(); return;
    }

    const logCancelBtn = e.target.closest("[data-log-cancel]");
    if (logCancelBtn) { logPicking = null; render(); return; }

    const logSaveBtn = e.target.closest("[data-log-save]");
    if (logSaveBtn) {
      const which = logSaveBtn.getAttribute("data-log-save");
      const byPortion = (getPrefs().logMode || "g") === "portion";
      let rid = which;
      if (which === "__intake__") {
        const sel = body.querySelector(".rb-log-dish");
        rid = sel ? sel.value : null;
      } else if (view !== "intake") {
        viewDate = todayKey();
      }
      if (!rid) return;
      let ok = false;
      if (byPortion) {
        const eat = parseFloat((body.querySelector(".rb-log-eat") || {}).value);
        const of = parseFloat((body.querySelector(".rb-log-of") || {}).value);
        if (!(eat > 0) || !(of > 0)) return;
        logPortion(rid, eat, of); ok = true;
      } else {
        const gInput = body.querySelector(".rb-log-grams");
        const grams = gInput ? parseFloat(gInput.value) : NaN;
        if (isNaN(grams) || grams <= 0) return;
        logIntake(rid, grams); ok = true;
      }
      if (ok) {
        logPicking = null;
        if (view === "intake") render();
        else openIntake();
      }
      return;
    }

    const logDelBtn = e.target.closest("[data-log-del]");
    if (logDelBtn) {
      const eid = Number(logDelBtn.getAttribute("data-log-del"));
      const all = getIntake();
      all[viewDate] = getDayLog(viewDate).filter(x => x.id !== eid);
      saveState(); render(); return;
    }

    const macroIngBtn = e.target.closest("[data-macro-ing]");
    if (macroIngBtn && currentId) {
      const idx = Number(macroIngBtn.getAttribute("data-macro-ing"));
      macroEditing = { id: currentId, idx: idx, photo: null, product: null, scanned: null, scanMsg: null };
      render();
      photoGet(photoKey(currentId, idx)).then(url => {
        if (url && macroEditing && macroEditing.id === currentId && macroEditing.idx === idx) {
          macroEditing.photo = url; render();
        }
      });
      return;
    }
    const scanBtn = e.target.closest("[data-scan-for]");
    if (scanBtn && currentId && macroEditing) {
      const target = { id: macroEditing.id, idx: macroEditing.idx };
      openScanner(code => macroCodeFound(target, code));
      return;
    }
    const typeForBtn = e.target.closest("[data-typecode-for]");
    if (typeForBtn && currentId && macroEditing) {
      const code = askBarcodeNumber();
      if (code) macroCodeFound({ id: macroEditing.id, idx: macroEditing.idx }, code);
      return;
    }

    const scopeBtn = e.target.closest("[data-scope]");
    if (scopeBtn && currentId && macroEditing && macroEditing.product) {
      const scope = scopeBtn.getAttribute("data-scope");
      const r = byId[currentId];
      const idx = macroEditing.idx;
      const prod = macroEditing.product;
      const st = getRecipeState(currentId);
      getPantry()[prod.code] = prod;
      if (scope === "everywhere") {
        getDefaults()[ingredientKey(r.ingredients[idx])] = prod.code;
        delete st.macros[idx];
        delete tempMacros[currentId + ":" + idx];
      } else if (scope === "recipe") {
        st.macros[idx] = { kcal: prod.kcal, p: prod.p, c: prod.c, f: prod.f, code: prod.code };
        delete tempMacros[currentId + ":" + idx];
      } else {
        tempMacros[currentId + ":" + idx] = prod;
      }
      if (macroEditing.photo) photoPut(photoKey(currentId, idx), macroEditing.photo);
      macroEditing = null;
      saveState(); render(); return;
    }

    const macroCancelBtn = e.target.closest("[data-macro-cancel]");
    if (macroCancelBtn) { macroEditing = null; render(); return; }
    const macroClearBtn = e.target.closest("[data-macro-clear]");
    if (macroClearBtn && currentId) {
      const idx = Number(macroClearBtn.getAttribute("data-macro-clear"));
      const st = getRecipeState(currentId);
      delete st.macros[idx];
      delete tempMacros[currentId + ":" + idx];
      delete getDefaults()[ingredientKey(byId[currentId].ingredients[idx])];
      photoDel(photoKey(currentId, idx));
      macroEditing = null;
      saveState(); render(); return;
    }
    const macroSaveBtn = e.target.closest("[data-macro-save]");
    if (macroSaveBtn && currentId) {
      const idx = Number(macroSaveBtn.getAttribute("data-macro-save"));
      const num = cls => {
        const el = body.querySelector(cls);
        const v = el ? parseFloat(el.value) : NaN;
        return isNaN(v) || v < 0 ? null : v;
      };
      const kcal = num(".rb-m-kcal"), pp = num(".rb-m-p"), cc = num(".rb-m-c"), ff = num(".rb-m-f");
      const st = getRecipeState(currentId);
      if (kcal === null && pp === null && cc === null && ff === null) {
        delete st.macros[idx];
      } else {
        const key = getNutKey(r_byId(currentId).ingredients[idx]);
        const ref = key && NUT[key] ? NUT[key] : { kcal: 0, p: 0, c: 0, f: 0 };
        st.macros[idx] = {
          kcal: kcal === null ? ref.kcal : kcal,
          p: pp === null ? ref.p : pp,
          c: cc === null ? ref.c : cc,
          f: ff === null ? ref.f : ff
        };
      }
      if (macroEditing && macroEditing.photo) photoPut(photoKey(currentId, idx), macroEditing.photo);
      macroEditing = null;
      saveState(); render(); return;
    }

    const calcBtn = e.target.closest("[data-calc]");
    if (calcBtn && currentId) {
      calcFlash = currentId;
      breakdownOpen = currentId;
      render();
      setTimeout(() => { calcFlash = null; }, 1600);
      return;
    }
    const bdBtn = e.target.closest("[data-breakdown]");
    if (bdBtn && currentId) {
      breakdownOpen = breakdownOpen === currentId ? null : currentId;
      render(); return;
    }

    const cookedEditBtn = e.target.closest("[data-cooked-edit]");
    if (cookedEditBtn) { weighEditing = cookedEditBtn.getAttribute("data-cooked-edit"); render(); return; }
    const cookedCancelBtn = e.target.closest("[data-cooked-cancel]");
    if (cookedCancelBtn) { weighEditing = null; render(); return; }
    const cookedClearBtn = e.target.closest("[data-cooked-clear]");
    if (cookedClearBtn) {
      const st = getRecipeState(cookedClearBtn.getAttribute("data-cooked-clear"));
      delete st.cookedG;
      weighEditing = null;
      saveState(); render(); return;
    }
    const cookedSaveBtn = e.target.closest("[data-cooked-save]");
    if (cookedSaveBtn) {
      const rid = cookedSaveBtn.getAttribute("data-cooked-save");
      const st = getRecipeState(rid);
      const input = body.querySelector(".rb-cooked-input");
      const val = input ? parseFloat(input.value) : NaN;
      if (!isNaN(val) && val > 0) st.cookedG = val / st.servings;
      else delete st.cookedG;
      weighEditing = null;
      saveState(); render(); return;
    }

    const goalEditBtn = e.target.closest("[data-goal-edit]");
    if (goalEditBtn) { goalEditing = true; render(); return; }
    const goalCancelBtn = e.target.closest("[data-goal-cancel]");
    if (goalCancelBtn) { goalEditing = false; render(); return; }
    const goalSaveBtn = e.target.closest("[data-goal-save]");
    if (goalSaveBtn) {
      const kInput = body.querySelector(".rb-goal-kcal");
      const pInput = body.querySelector(".rb-goal-p");
      const goals = getGoals();
      const kv = kInput ? parseFloat(kInput.value) : NaN;
      const pv = pInput ? parseFloat(pInput.value) : NaN;
      goals.kcal = isNaN(kv) || kv < 0 ? 0 : Math.round(kv);
      goals.p = isNaN(pv) || pv < 0 ? 0 : Math.round(pv);
      goalEditing = false;
      saveState(); render(); return;
    }

    const incBtn = e.target.closest("[data-inc]");
    if (incBtn && currentId) {
      const st = getRecipeState(currentId);
      if (st.servings < 10) st.servings++;
      saveState(); render(); return;
    }
    const decBtn = e.target.closest("[data-dec]");
    if (decBtn && currentId) {
      const st = getRecipeState(currentId);
      if (st.servings > 1) st.servings--;
      saveState(); render(); return;
    }
    const resetBtn = e.target.closest("[data-reset]");
    if (resetBtn && !resetBtn.disabled && currentId) {
      const st = getRecipeState(currentId);
      st.checked = {};
      saveState(); render(); return;
    }
    const resetIngBtn = e.target.closest("[data-reset-ingredients]");
    if (resetIngBtn && !resetIngBtn.disabled && currentId) {
      const st = getRecipeState(currentId);
      st.overrides = {};
      st.custom.forEach(c => delete st.checked["custom_" + c.id]);
      st.custom = [];
      st.customSeq = 0;
      delete editingIng[currentId];
      saveState(); render(); return;
    }
    const addBtn = e.target.closest("[data-add-ing]");
    if (addBtn) { tryAddIngredient(); return; }

    const removeBtn = e.target.closest("[data-remove-custom]");
    if (removeBtn && currentId) {
      const cid = Number(removeBtn.getAttribute("data-remove-custom"));
      const st = getRecipeState(currentId);
      st.custom = st.custom.filter(c => c.id !== cid);
      delete st.checked["custom_" + cid];
      saveState(); render(); return;
    }

    const editIngBtn = e.target.closest("[data-edit-ing]");
    if (editIngBtn && currentId) {
      editingIng[currentId] = Number(editIngBtn.getAttribute("data-edit-ing"));
      render(); return;
    }
    const editSaveBtn = e.target.closest("[data-edit-save]");
    if (editSaveBtn && currentId) {
      const idx = Number(editSaveBtn.getAttribute("data-edit-save"));
      const input = body.querySelector(".rb-edit-amount-input");
      const val = input ? parseFloat(input.value) : NaN;
      if (!isNaN(val) && val >= 0) {
        const st = getRecipeState(currentId);
        st.overrides[idx] = { amount: val };
        delete editingIng[currentId];
        saveState(); render();
      }
      return;
    }
    const editRemoveBtn = e.target.closest("[data-edit-remove]");
    if (editRemoveBtn && currentId) {
      const idx = Number(editRemoveBtn.getAttribute("data-edit-remove"));
      const st = getRecipeState(currentId);
      st.overrides[idx] = { removed: true };
      delete editingIng[currentId];
      saveState(); render(); return;
    }
    const editCancelBtn = e.target.closest("[data-edit-cancel]");
    if (editCancelBtn && currentId) {
      delete editingIng[currentId];
      render(); return;
    }
    const restoreBtn = e.target.closest("[data-restore-ing]");
    if (restoreBtn && currentId) {
      const idx = Number(restoreBtn.getAttribute("data-restore-ing"));
      const st = getRecipeState(currentId);
      delete st.overrides[idx];
      saveState(); render(); return;
    }

    const chipBtn = e.target.closest("[data-side-chip]");
    if (chipBtn && currentId) {
      sidePicking[currentId] = chipBtn.getAttribute("data-side-chip");
      render(); return;
    }
    const portionBtn = e.target.closest("[data-side-portion]");
    if (portionBtn && currentId) {
      const type = sidePicking[currentId];
      const cfg = sideTypeByKey[type];
      if (cfg) commitSide(type, cfg.portion);
      return;
    }
    const manualAddBtn = e.target.closest("[data-side-manual-add]");
    if (manualAddBtn && currentId) {
      const input = body.querySelector(".rb-side-manual-input");
      const val = input ? parseFloat(input.value) : NaN;
      const type = sidePicking[currentId];
      if (type && !isNaN(val) && val > 0) commitSide(type, val);
      return;
    }
    const cancelBtn = e.target.closest("[data-side-cancel]");
    if (cancelBtn && currentId) { delete sidePicking[currentId]; render(); return; }

    const sideRemoveBtn = e.target.closest("[data-side-remove]");
    if (sideRemoveBtn && currentId) {
      const st = getRecipeState(currentId);
      st.side = null;
      delete st.checked["side"];
      saveState(); render(); return;
    }
  });

  root.addEventListener("input", (e) => {
    if (e.target.classList.contains("rb-b-title")) {
      getDraft().title = e.target.value;
      saveState();
      const btn = body.querySelector("[data-bsave]");
      if (btn) btn.disabled = !(e.target.value.trim() && getDraft().items.length);
    }
  });

  root.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.classList.contains("rb-b-step")) {
      e.preventDefault();
      const btn = body.querySelector("[data-bstep-add]");
      if (btn) btn.click();
      return;
    }
    if (e.key === "Enter" && e.target.classList.contains("rb-add-input")
        && !e.target.classList.contains("rb-b-title") && !e.target.classList.contains("rb-pp-name")) {
      e.preventDefault(); tryAddIngredient();
    }
    if (e.key === "Enter" && e.target.classList.contains("rb-side-manual-input")) {
      e.preventDefault();
      const btn = body.querySelector("[data-side-manual-add]");
      if (btn) btn.click();
    }
    if (e.key === "Enter" && e.target.classList.contains("rb-edit-amount-input")) {
      e.preventDefault();
      const btn = body.querySelector("[data-edit-save]");
      if (btn) btn.click();
    }
    if (e.key === "Enter" && e.target.classList.contains("rb-log-grams")) {
      e.preventDefault();
      const btn = body.querySelector("[data-log-save]");
      if (btn) btn.click();
    }
  });

  root.addEventListener("change", (e) => {
    if (e.target.classList.contains("rb-gallery-input")) {
      const file = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!file) return;
      const el = e.target;
      if (el.hasAttribute("data-pp-gallery")) { pickerGallery(el.getAttribute("data-pp-gallery"), file); return; }
      if (el.hasAttribute("data-gallery-for") && macroEditing) {
        const target = { id: macroEditing.id, idx: macroEditing.idx };
        macroEditing.scanMsg = "Reading the barcode from your picture\u2026"; macroEditing.scanOk = true; render();
        decodeBarcodeFromFile(file).then(code => macroCodeFound(target, code)).catch(err => {
          if (!macroEditing || macroEditing.id !== target.id || macroEditing.idx !== target.idx) return;
          macroEditing.scanMsg = galleryErrorText(err); macroEditing.scanOk = false; render();
        });
        return;
      }
      if (el.hasAttribute("data-pgallery") && pantryEditing) {
        const key = pantryEditing.key;
        pantryEditing.scanMsg = "Reading the barcode from your picture\u2026"; pantryEditing.scanOk = true; render();
        decodeBarcodeFromFile(file).then(code => needCodeFound(key, code)).catch(err => {
          if (!pantryEditing || pantryEditing.key !== key) return;
          pantryEditing.scanMsg = galleryErrorText(err); pantryEditing.scanOk = false; render();
        });
        return;
      }
      return;
    }
    if (e.target.matches("[data-pp-select]")) {
      pickerSelect(e.target.getAttribute("data-pp-select"), e.target.value);
      render(); return;
    }
    if (e.target.classList.contains("rb-log-dish")) { logDishSel = e.target.value; render(); return; }
    if (e.target.classList.contains("rb-b-gin")) {
      const it = getDraft().items[Number(e.target.getAttribute("data-bidx"))];
      const v = parseFloat(e.target.value);
      if (it && v > 0) { it.g = v; saveState(); }
      render(); return;
    }
    if (e.target.classList.contains("rb-photo-input")) {
      const file = e.target.files && e.target.files[0];
      if (!file || !macroEditing) return;
      shrinkImage(file, 1100, 0.68)
        .then(url => { if (macroEditing) { macroEditing.photo = url; render(); } })
        .catch(() => {});
      return;
    }
    if (e.target.classList.contains("rb-ing-check") && currentId) {
      const key = e.target.getAttribute("data-key");
      const st = getRecipeState(currentId);
      st.checked[key] = e.target.checked;
      saveState(); render(); return;
    }
    if (e.target.classList.contains("rb-switch-input")) {
      const key = e.target.getAttribute("data-pref");
      const prefs = getPrefs();
      prefs[key] = e.target.checked;
      saveState(); render(); return;
    }
  });

  loadState().then(() => {
    viewDate = todayKey();
    const hash = location.hash ? location.hash.slice(1) : "";
    if (hash && byId[hash]) {
      currentId = hash;
      view = "recipe";
      history.replaceState({ rb: "home" }, "", location.pathname + location.search);
      history.pushState({ rb: "recipe", id: hash }, "", "#" + hash);
    } else if (hash === "create") {
      view = "create";
      history.replaceState({ rb: "home" }, "", location.pathname + location.search);
      history.pushState({ rb: "create" }, "", "#create");
    } else if (hash === "pantry") {
      view = "pantry";
      history.replaceState({ rb: "home" }, "", location.pathname + location.search);
      history.pushState({ rb: "pantry" }, "", "#pantry");
    } else if (hash === "intake") {
      view = "intake";
      history.replaceState({ rb: "home" }, "", location.pathname + location.search);
      history.pushState({ rb: "intake" }, "", "#intake");
    } else {
      history.replaceState({ rb: "home" }, "", location.pathname + location.search);
    }
    render();
  });
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
